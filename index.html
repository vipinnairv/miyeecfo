<script>
/* ── FONT PREFERENCE ──────────────────────────────────────────────
   Runs before React mounts, so the chosen font is applied on the very
   first paint (no flash of the wrong font). Privacy-first: Verdana and
   Calibri are already on the device and load nothing; Poppins and Google
   Sans fetch a web font ONLY when the user actually selects them. Stored
   in localStorage only. It is a per-device preference, never part of the
   financial data export. */
(function(){
  var F={
    verdana   :{label:'Verdana (Default)',stack:"Verdana,Geneva,'DejaVu Sans',sans-serif"},
    calibri   :{label:'Calibri',          stack:"Calibri,'Segoe UI',Candara,Optima,'Trebuchet MS',sans-serif"},
    poppins   :{label:'Poppins',          stack:"'Poppins','Segoe UI',sans-serif",
                web:'https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap'},
    // 'Google Sans' is not a public web font; it renders for users who have it
    // installed, and everyone else falls back to Roboto (Google's system face),
    // which we load so the option always looks the part.
    googlesans:{label:'Google Sans',      stack:"'Google Sans','Product Sans','Roboto','Segoe UI',sans-serif",
                web:'https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap'}
  };
  function apply(key){
    var f=F[key]||F.verdana;
    document.documentElement.style.setProperty('--f',f.stack);
    if(f.web&&!document.querySelector('link[data-font="'+key+'"]')){
      var l=document.createElement('link');
      l.rel='stylesheet';l.href=f.web;l.setAttribute('data-font',key);
      document.head.appendChild(l);
    }
  }
  window.FONTS=F;
  window.applyFont=apply;
  try{apply(localStorage.getItem('fm_font')||'verdana');}catch(e){}
})();
</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --g:#00b386;--gd:#007a62;--gl:#e6f9f4;--gxl:#f0fdf9;
  --b:#2563eb;--bl:#eff6ff;--bd:#1e40af;
  --r:#dc2626;--rl:#fef2f2;
  --o:#d97706;--ol:#fffbeb;
  --p:#7c3aed;--pl:#f5f3ff;
  --t:#0d9488;--tl:#f0fdfa;
  --n50:#f8fafc;--n100:#f1f5f9;--n200:#e2e8f0;--n300:#cbd5e1;
  --n400:#94a3b8;--n500:#64748b;--n600:#475569;--n700:#334155;--n800:#1e293b;--n900:#0f172a;
  --W:#fff;
  --xs:0 1px 2px rgba(0,0,0,.04);
  --sm:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.05);
  --md:0 4px 6px -1px rgba(0,0,0,.07),0 2px 4px -2px rgba(0,0,0,.04);
  --lg:0 10px 15px -3px rgba(0,0,0,.08),0 4px 6px -4px rgba(0,0,0,.04);
  --xl:0 20px 25px -5px rgba(0,0,0,.08),0 8px 10px -6px rgba(0,0,0,.04);
  --r4:4px;--r6:6px;--r8:8px;--r12:12px;--r16:16px;--r20:20px;
  /* Verdana is a system font: no webfont request, renders identically offline.
     Figures keep a monospace face so columns of numbers stay aligned. */
  --f:Verdana,Geneva,'DejaVu Sans',sans-serif;--m:'JetBrains Mono',Consolas,monospace;
  --sb:220px;
}
html{scroll-behavior:smooth;overflow-x:hidden}
body{font-family:var(--f);background:var(--n50);color:var(--n900);line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
#root{display:flex;min-height:100vh;overflow-x:hidden}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--n200);border-radius:99px}

/* ── SIDEBAR ─────────────────────────────────── */
.sb{width:var(--sb);background:var(--W);border-right:1px solid var(--n100);position:fixed;inset:0 auto 0 0;display:flex;flex-direction:column;z-index:200;overflow-y:auto;overflow-x:hidden}
.sb-head{padding:13px 12px 10px;border-bottom:1px solid var(--n100);display:flex;align-items:center;gap:8px;flex-shrink:0}
.sb-mark{width:30px;height:30px;background:linear-gradient(135deg,var(--g),var(--gd));border-radius:9px;display:grid;place-items:center;flex-shrink:0;box-shadow:0 2px 6px rgba(0,179,134,.25)}
.sb-mark svg{width:16px;height:16px;fill:#fff}
.sb-app{font-weight:800;font-size:13px;color:var(--n900);letter-spacing:-.2px;line-height:1.2}
.sb-period{font-size:9px;color:var(--n400);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-nav{flex:1;padding:6px 0;overflow-y:auto}
.sb-group{padding:9px 11px 2px;font-size:8.5px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;color:var(--n400)}
.sb-item{display:flex;align-items:center;gap:7px;padding:7px 9px;margin:1px 4px;border-radius:var(--r6);cursor:pointer;font-size:12px;font-weight:500;color:var(--n500);transition:all .13s;position:relative;user-select:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-item:hover{background:var(--n50);color:var(--n800)}
.sb-item.on{background:var(--gl);color:var(--gd);font-weight:700}
.sb-item.on::before{content:'';position:absolute;left:-4px;top:50%;transform:translateY(-50%);width:3px;height:16px;background:var(--g);border-radius:0 3px 3px 0}
.sb-ic{width:14px;height:14px;flex-shrink:0;opacity:.65}
.sb-item.on .sb-ic{opacity:1}
.sb-badge{margin-left:auto;font-size:9px;font-weight:700;background:var(--r);color:#fff;padding:1px 5px;border-radius:99px;min-width:16px;text-align:center;flex-shrink:0}
.sb-foot{padding:8px 7px;border-top:1px solid var(--n100);flex-shrink:0}
.sb-user{display:flex;align-items:center;gap:8px;padding:6px;border-radius:var(--r8);cursor:pointer;transition:background .13s}
.sb-user:hover{background:var(--n50)}
.sb-av{width:28px;height:28px;background:linear-gradient(135deg,#667eea,#764ba2);border-radius:50%;display:grid;place-items:center;font-size:10.5px;font-weight:700;color:#fff;flex-shrink:0}
.sb-uname{font-size:11.5px;font-weight:600;color:var(--n700)}
.sb-uemail{font-size:9.5px;color:var(--n400);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:140px}

/* ── MAIN ───────────────────────────────────── */
.main{margin-left:var(--sb);flex:1;min-width:0;display:flex;flex-direction:column;min-height:100vh;overflow-x:hidden;max-width:calc(100vw - var(--sb))}
.topbar{background:var(--W);border-bottom:1px solid var(--n100);height:50px;padding:0 18px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:var(--xs)}
.tb-left{display:flex;align-items:center;gap:8px}
.tb-title{font-size:13.5px;font-weight:700;color:var(--n900)}
.tb-right{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.page{padding:16px 18px 40px;flex:1;max-width:1380px;width:100%}

/* ── CARD ───────────────────────────────────── */
.card{background:var(--W);border:1px solid var(--n100);border-radius:var(--r12);padding:14px 16px;box-shadow:var(--xs);transition:box-shadow .13s;min-width:0;overflow:hidden}
.card:hover{box-shadow:var(--sm)}
.card.flat{box-shadow:none}
.cl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--n400);margin-bottom:4px}
.cv{font-size:20px;font-weight:800;font-family:var(--m);color:var(--n900);line-height:1.15;letter-spacing:-.6px}
.cv.g{color:var(--gd)} .cv.r{color:var(--r)} .cv.o{color:var(--o)} .cv.b{color:var(--b)} .cv.p{color:var(--p)}
.cm{font-size:11px;color:var(--n400);margin-top:3px}
.ci{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;margin-bottom:10px}
.ci svg{width:18px;height:18px}

/* ── GRIDS ──────────────────────────────────── */
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.row{display:flex;gap:12px;min-width:0}
.col{flex:1;min-width:0}
.mb1{margin-bottom:5px}.mb2{margin-bottom:10px}.mb3{margin-bottom:16px}.mb4{margin-bottom:22px}

/* ── TABLE ──────────────────────────────────── */
.tw{overflow-x:auto;border-radius:var(--r12);border:1px solid var(--n100);background:var(--W)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
thead tr{background:var(--n50);border-bottom:1px solid var(--n100)}
th{padding:9px 12px;text-align:left;font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--n500);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--n50);color:var(--n700);vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr:hover td{background:#fafbfc}
.num{font-family:var(--m);text-align:right;font-size:12px}
.pos{color:var(--gd);font-weight:600}.neg{color:var(--r);font-weight:600}
.tft td{background:var(--n50)!important;font-weight:700;border-top:2px solid var(--n200)}

/* ── PROGRESS ───────────────────────────────── */
.prog{height:5px;background:var(--n100);border-radius:99px;overflow:hidden}
.pf{height:100%;border-radius:99px;transition:width .5s ease}

/* ── TAGS ───────────────────────────────────── */
.tag{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:99px;font-size:10.5px;font-weight:600;white-space:nowrap}
.tg{background:var(--gl);color:var(--gd)}.tr{background:var(--rl);color:var(--r)}
.tb{background:var(--bl);color:var(--bd)}.to{background:var(--ol);color:var(--o)}
.tx{background:var(--n100);color:var(--n500)}.tp{background:var(--pl);color:var(--p)}

/* ── FORM ───────────────────────────────────── */
.fg{display:flex;flex-direction:column;gap:4px;min-width:0}
.fg-full{grid-column:1/-1}
.fg label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--n500)}
.fg input,.fg select,.fg textarea{padding:8px 11px;border:1.5px solid var(--n200);border-radius:var(--r6);font-size:13px;font-family:var(--f);color:var(--n900);background:var(--W);outline:none;transition:border-color .13s,box-shadow .13s;width:100%}
.fg input:focus,.fg select:focus{border-color:var(--g);box-shadow:0 0 0 3px rgba(0,179,134,.1)}
.f2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.f3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.f4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}

/* ── BUTTONS ─────────────────────────────────── */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:var(--r6);font-size:12.5px;font-weight:600;font-family:var(--f);cursor:pointer;border:none;transition:all .13s;white-space:nowrap;line-height:1}
.btn svg{width:13px;height:13px;flex-shrink:0}
.btn-p{background:var(--g);color:#fff;box-shadow:0 1px 3px rgba(0,179,134,.25)}
.btn-p:hover{background:var(--gd)}
.btn-s{background:var(--W);color:var(--n700);border:1.5px solid var(--n200)}
.btn-s:hover{background:var(--n50);border-color:var(--n300)}
.btn-d{background:var(--rl);color:var(--r)}
.btn-d:hover{background:var(--r);color:#fff}
.btn-g{background:transparent;color:var(--n500);padding:5px 8px}
.btn-g:hover{background:var(--n100);color:var(--n700)}
.btn-sm{padding:5px 10px;font-size:11.5px}
.bic{padding:6px;border-radius:var(--r6);background:var(--n50);border:1px solid var(--n200);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:all .13s;color:var(--n500)}
.bic:hover{background:var(--n100);color:var(--n700)}
.bic svg{width:12px;height:12px}
.bic.red{color:var(--r)}
.bic.red:hover{background:var(--r);color:#fff}

/* ── TOGGLE ─────────────────────────────────── */
.tgl{display:flex;background:var(--n100);border-radius:99px;padding:3px;gap:2px}
.tgo{padding:5px 12px;border-radius:99px;font-size:11.5px;font-weight:600;cursor:pointer;border:none;background:transparent;color:var(--n500);transition:all .13s;font-family:var(--f)}
.tgo.on{background:var(--W);color:var(--gd);box-shadow:var(--xs)}

/* ── MODAL ──────────────────────────────────── */
.ov{position:fixed;inset:0;background:rgba(15,23,42,.45);backdrop-filter:blur(3px);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--W);border-radius:var(--r16);box-shadow:var(--xl);width:100%;max-width:600px;max-height:92vh;overflow-y:auto}
.mh{padding:18px 20px 0;display:flex;align-items:center;justify-content:space-between}
.mt{font-size:15px;font-weight:700}
.mb{padding:14px 20px}
.mf{padding:0 20px 18px;display:flex;justify-content:flex-end;gap:8px}

/* ── SECTION HEADER ─────────────────────────── */
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.sh-t{font-size:13px;font-weight:700;color:var(--n900);display:flex;align-items:center;gap:7px}

/* ── ALERTS ──────────────────────────────────── */
.alert{display:flex;align-items:flex-start;gap:9px;padding:10px 12px;border-radius:var(--r8);font-size:12px;margin-bottom:12px}
.alert svg{width:14px;height:14px;flex-shrink:0;margin-top:1px}
.aw{background:var(--ol);color:#92400e;border-left:3px solid var(--o)}
.ai{background:var(--bl);color:var(--bd);border-left:3px solid var(--b)}
.as{background:var(--gl);color:var(--gd);border-left:3px solid var(--g)}
.ae{background:var(--rl);color:var(--r);border-left:3px solid var(--r)}

/* ── TOAST ──────────────────────────────────── */
.toast{position:fixed;bottom:20px;right:20px;z-index:2000;color:#fff;padding:10px 15px;border-radius:var(--r8);font-size:12.5px;font-weight:500;box-shadow:var(--xl);display:flex;align-items:center;gap:8px;animation:tin .22s ease}
@keyframes tin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.toast.g{background:var(--gd)}.toast.r{background:var(--r)}.toast.x{background:var(--n800)}.toast.o{background:var(--o)}.toast.b{background:var(--bd)}
.toast-act{margin-left:6px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);
  color:#fff;font-family:var(--f);font-size:11.5px;font-weight:700;padding:4px 11px;
  border-radius:99px;cursor:pointer;transition:background .13s;white-space:nowrap}
.toast-act:hover{background:rgba(255,255,255,.32)}
.toast-act:focus-visible{outline:2px solid #fff;outline-offset:2px}

/* ── DONUT ──────────────────────────────────── */
.donut{position:relative;display:inline-flex;align-items:center;justify-content:center}
.donut-c{position:absolute;text-align:center;pointer-events:none}

/* ── STAT ROW ───────────────────────────────── */
.sr{display:flex;align-items:center;justify-content:space-between;padding:7.5px 0;border-bottom:1px solid var(--n50)}
.sr:last-child{border-bottom:none}
.sr-l{font-size:12.5px;color:var(--n600)}
.sr-v{font-family:var(--m);font-size:12.5px;font-weight:600}

/* ── CC DUE CARDS ─────────────────────────────── */
.due-card{border-radius:var(--r12);padding:14px 16px;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:8px}
.due-card::before{content:'';position:absolute;right:-15px;top:-15px;width:80px;height:80px;background:rgba(255,255,255,.1);border-radius:50%}
.due-urgency{display:flex;align-items:center;justify-content:space-between}
.due-days-badge{padding:3px 10px;border-radius:99px;font-size:10px;font-weight:700;backdrop-filter:blur(4px)}
.due-bank{font-size:10px;font-weight:700;opacity:.7;letter-spacing:.5px;text-transform:uppercase}
.due-card-type{font-size:13px;font-weight:700;margin-top:1px}
.due-amount-row{display:flex;justify-content:space-between;align-items:flex-end}
.due-amount{font-family:var(--m);font-size:18px;font-weight:800}
.due-date-block{text-align:right}
.due-date-label{font-size:9px;opacity:.65;text-transform:uppercase;letter-spacing:.5px}
.due-date-val{font-size:12px;font-weight:700}

/* ── ACCOUNT ROW ───────────────────────────── */
.acc-row{display:flex;align-items:center;gap:11px;padding:9px 0;border-bottom:1px solid var(--n50)}
.acc-row:last-child{border-bottom:none}
.acc-ic{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;flex-shrink:0;font-size:10px;font-weight:700}
.acc-name{font-size:12.5px;font-weight:600;color:var(--n800)}
.acc-no{font-size:10px;color:var(--n400);font-family:var(--m)}
.acc-bal{margin-left:auto;text-align:right}
.acc-num{font-family:var(--m);font-size:13px;font-weight:700}

/* ── MONTH CHIPS ────────────────────────────── */
.mbar{display:flex;gap:4px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;scrollbar-width:none}
.mbar::-webkit-scrollbar{display:none}
.mchip{padding:5px 11px;border-radius:99px;font-size:11.5px;font-weight:600;cursor:pointer;white-space:nowrap;border:1.5px solid var(--n200);background:var(--W);color:var(--n500);transition:all .13s;flex-shrink:0;font-family:var(--f);line-height:1.35}
.mchip.on{background:var(--g);color:#fff;border-color:var(--g);box-shadow:0 2px 6px rgba(0,179,134,.25)}
.mchip:hover:not(.on){border-color:var(--g);color:var(--gd)}
.mchip:focus-visible{outline:2px solid var(--g);outline-offset:2px}

/* ── DASHBOARD SPECIAL ──────────────────────── */
.hero{background:linear-gradient(135deg,#0a2540 0%,#1a4a6e 45%,#0d6e5a 100%);border-radius:var(--r16);padding:22px 24px;color:#fff;margin-bottom:16px;position:relative;overflow:hidden}
.hero::after{content:'';position:absolute;right:-40px;top:-40px;width:200px;height:200px;background:rgba(0,179,134,.12);border-radius:50%}
.hero::before{content:'';position:absolute;right:80px;bottom:-60px;width:160px;height:160px;background:rgba(255,255,255,.04);border-radius:50%}
.hero-label{font-size:11px;opacity:.65;text-transform:uppercase;letter-spacing:.8px;margin-bottom:4px}
.hero-amount{font-family:var(--m);font-size:32px;font-weight:800;letter-spacing:-1.5px;line-height:1}
.hero-sub{font-size:11.5px;opacity:.6;margin-top:5px}
.hero-pills{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;position:relative;z-index:1}
.hero-pill{background:rgba(255,255,255,.12);backdrop-filter:blur(4px);border:1px solid rgba(255,255,255,.15);border-radius:var(--r8);padding:8px 12px;min-width:100px}
.hero-pill-label{font-size:9px;opacity:.6;text-transform:uppercase;letter-spacing:.5px;margin-bottom:2px}
.hero-pill-val{font-family:var(--m);font-size:14px;font-weight:700}
.hero-pill-val.gr{color:#6ee7b7}
.hero-pill-val.rd{color:#fca5a5}
.hero-pill-val.yw{color:#fcd34d}

/* ── KPI CARD SPECIAL ───────────────────────── */
.kpi-card{background:var(--W);border:1px solid var(--n100);border-radius:var(--r12);padding:16px 18px;box-shadow:var(--xs);position:relative;overflow:hidden;transition:all .15s}
.kpi-card:hover{box-shadow:var(--md);transform:translateY(-1px)}
.kpi-card::after{content:'';position:absolute;right:-20px;top:-20px;width:70px;height:70px;border-radius:50%;opacity:.06}
.kpi-card.g::after{background:var(--g)}
.kpi-card.r::after{background:var(--r)}
.kpi-card.o::after{background:var(--o)}
.kpi-card.b::after{background:var(--b)}
.kpi-ic-wrap{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.kpi-ic{width:36px;height:36px;border-radius:9px;display:grid;place-items:center}
.kpi-ic svg{width:17px;height:17px}
.kpi-trend{font-size:10px;font-weight:700;padding:3px 8px;border-radius:99px}

/* ── CHART BARS ─────────────────────────────── */
.barchart{display:flex;align-items:flex-end;gap:3px;padding-top:8px}
.barcol{flex:1;display:flex;flex-direction:column;align-items:center}
.barpair{display:flex;gap:1.5px;align-items:flex-end;width:100%}
.bar{flex:1;border-radius:2px 2px 0 0;min-height:2px;transition:height .4s ease;cursor:pointer}
.bar:hover{opacity:.8}
.bar-lbl{font-size:8.5px;color:var(--n400);margin-top:3px;white-space:nowrap}

/* ── DIVIDER ─────────────────────────────────── */
.div{height:1px;background:var(--n100);margin:14px 0}

/* ── PAGE HEADER ────────────────────────────── */
.ph{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:16px}
.ptitle{font-size:19px;font-weight:800;color:var(--n900);letter-spacing:-.4px}
.psub{font-size:12px;color:var(--n400);margin-top:2px}

/* ── UTILITY ────────────────────────────────── */
.flex{display:flex}.ic{align-items:center}.jb{justify-content:space-between}.g1{gap:5px}.g2i{gap:9px}.g3i{gap:13px}
.xs{font-size:10.5px}.sm{font-size:12px}
.muted{color:var(--n400)}.bold{font-weight:700}.mono{font-family:var(--m)}
.tr{text-align:right}.w100{width:100%}
.mt1{margin-top:4px}.mt2{margin-top:8px}.mt3{margin-top:13px}
@keyframes fadein{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.page>*{animation:fadein .2s ease both}
/* ── MOBILE BOTTOM NAV (base: hidden by default, shown via media query below) ── */
.mob-nav{display:none;position:fixed;bottom:0;left:0;right:0;height:58px;
  background:var(--W);border-top:1.5px solid var(--n200);z-index:300;
  align-items:stretch;box-shadow:0 -2px 10px rgba(0,0,0,.07)}
.mob-nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:3px;font-size:9px;font-weight:600;
  color:var(--n400);cursor:pointer;border:none;background:none;
  padding:0;font-family:var(--f);transition:color .13s}
.mob-nav-btn.on{color:var(--g)}
/* ── MOBILE MORE DRAWER (base) ── */
.mob-drawer-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:400}
.mob-drawer-overlay.open{display:block}
.mob-drawer{position:fixed;bottom:58px;left:0;right:0;background:var(--W);border-radius:20px 20px 0 0;
  z-index:401;max-height:72vh;overflow-y:auto;padding:8px 0 12px;
  box-shadow:0 -4px 24px rgba(0,0,0,.15);
  transform:translateY(100%);transition:transform .22s cubic-bezier(.4,0,.2,1)}
.mob-drawer.open{transform:translateY(0)}
.mob-drawer-handle{width:36px;height:4px;background:var(--n200);border-radius:4px;margin:6px auto 14px}
.mob-drawer-section{padding:0 16px 6px}
.mob-drawer-label{font-size:9.5px;font-weight:700;color:var(--n300);letter-spacing:.8px;
  text-transform:uppercase;padding:8px 4px 4px}
.mob-drawer-item{display:flex;align-items:center;gap:10px;padding:11px 8px;
  border-radius:8px;cursor:pointer;font-size:13px;font-weight:500;color:var(--n500);
  border:none;background:none;width:100%;text-align:left;font-family:var(--f)}
.mob-drawer-item:active{background:var(--n50)}
.mob-drawer-item.on{color:var(--g);background:var(--gl);font-weight:700}
.mob-drawer-item .di{font-size:16px;width:22px;text-align:center}
/* ── RESPONSIVE BREAKPOINTS ────────── */
/* 1366px laptops: main area ≈ 1146px → g4 stays 4-col (286px each), OK */
@media(max-width:1280px){
  .g4{grid-template-columns:repeat(2,1fr)}
  .page{padding:14px 16px 36px}
}
@media(max-width:1100px){
  .page{padding:12px 14px 32px}
  .g4{grid-template-columns:1fr 1fr}
  .g3{grid-template-columns:1fr 1fr}
  .tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .ph{flex-wrap:wrap;gap:8px}
}
@media(max-width:960px){
  .g3{grid-template-columns:1fr 1fr}
  .g2{grid-template-columns:1fr}
  .page{padding:10px 12px 28px}
}
@media(max-width:768px){
  :root{--sb:0px}
  .sb{display:none}
  .main{margin-left:0;max-width:100vw}
  .g4,.g3{grid-template-columns:1fr 1fr}
  .g2{grid-template-columns:1fr}
  .f3,.f4{grid-template-columns:1fr 1fr}
  .topbar{padding:6px 12px;height:46px}
  .tb-title{font-size:13px}
  .page{padding:10px 12px 76px}
  .mob-nav{display:flex}
  .tb-desktop{display:none!important}
  .qa-btn{bottom:70px;right:14px;width:46px;height:46px;font-size:22px}
  #gfooter{display:none!important}
}
@media(max-width:480px){
  .g4,.g3{grid-template-columns:1fr}
  .f2,.f3,.f4{grid-template-columns:1fr}
  .ph .btn{font-size:11px;padding:6px 10px}
  .page{padding:8px 10px 76px}
}
/* ── HERO BREAKUP (reads as an equation) ────── */
.hero-calc{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap;
  margin-top:16px;padding-top:14px;border-top:1px solid rgba(255,255,255,.1);
  position:relative;z-index:1}
.hero-term{min-width:78px}
.hero-term-l{font-size:9px;opacity:.5;text-transform:uppercase;letter-spacing:.6px;
  margin-bottom:3px;white-space:nowrap}
.hero-term-v{font-family:var(--m);font-size:13px;font-weight:700;white-space:nowrap}
.hero-op{font-family:var(--m);font-size:13px;font-weight:700;opacity:.4;
  padding-bottom:1px;flex-shrink:0}
@media(max-width:700px){
  .hero-calc{gap:7px}
  .hero-term{min-width:64px}
  .hero-term-v{font-size:11.5px}
  .hero-op{font-size:11px}
}

/* ── SHORT-TERM LIQUIDITY CARD ──────────────── */
/* Dedicated text tokens: --gd/--r are tuned for light surfaces and are also used as
   solid backgrounds elsewhere, so they cannot simply be brightened for dark mode. */
:root{--pos:#007a62;--neg:#dc2626;--warn:#b45309}
[data-theme="dark"]{--pos:#34d399;--neg:#f87171;--warn:#fbbf24}
.stl-card{border-left:3px solid var(--b)}
.stl-row{display:flex;gap:22px;align-items:flex-start;flex-wrap:wrap}
.stl-main{min-width:230px;flex:1}
.stl-val{font-family:var(--m);font-size:26px;font-weight:800;letter-spacing:-.8px;line-height:1.1}
.stl-sub{font-size:11.5px;color:var(--n500);margin-top:6px;line-height:1.5;max-width:420px}
.stl-calc{display:flex;align-items:flex-start;gap:9px;flex-wrap:wrap;
  padding:10px 14px;background:var(--n50);border:1px solid var(--n100);border-radius:var(--r8)}
.stl-term{min-width:74px}
.stl-term-l{font-size:9px;color:var(--n400);text-transform:uppercase;letter-spacing:.5px;
  margin-bottom:3px;white-space:nowrap}
.stl-term-v{font-family:var(--m);font-size:13px;font-weight:700;white-space:nowrap}
.stl-term-n{font-size:9px;color:var(--n400);margin-top:2px;white-space:nowrap;font-style:italic}
.stl-op{font-family:var(--m);font-size:13px;font-weight:700;color:var(--n300);margin-top:13px;flex-shrink:0}
.stl-foot{display:flex;gap:16px;flex-wrap:wrap;justify-content:space-between;
  margin-top:12px;padding-top:10px;border-top:1px dashed var(--n200);
  font-size:11px;color:var(--n500)}
@media(max-width:820px){
  .stl-row{gap:14px}
  .stl-calc{gap:7px;padding:9px 11px}
  .stl-term{min-width:62px}
  .stl-term-v{font-size:11.5px}
  .stl-val{font-size:22px}
}

/* ── SUB-PAGE TAB STRIP ─────────────────────── */
.tabs{display:flex;gap:2px;padding:0 20px;background:var(--W);
  border-bottom:1.5px solid var(--n200);overflow-x:auto;
  -webkit-overflow-scrolling:touch;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:9px 14px 8px;font-size:12.5px;font-weight:600;color:var(--n400);
  background:none;border:none;border-bottom:2.5px solid transparent;cursor:pointer;
  font-family:var(--f);white-space:nowrap;transition:color .13s,border-color .13s}
.tab:hover{color:var(--n700)}
.tab.on{color:var(--g);border-bottom-color:var(--g)}
.tab:focus-visible{outline:2px solid var(--g);outline-offset:-2px;border-radius:4px}
@media(max-width:768px){.tabs{padding:0 12px}.tab{font-size:11.5px;padding:8px 11px 7px}}

/* ── TOPBAR PERIOD PICKER ───────────────────── */
.per-pick{display:flex;align-items:center;gap:4px;background:var(--n50);
  border:1.5px solid var(--n200);border-radius:8px;padding:3px 7px}
.per-pick input{border:none;background:none;font-family:var(--m);font-size:11px;
  color:var(--n700);width:88px;padding:1px 2px;cursor:pointer}
.per-pick input:focus{outline:1.5px solid var(--g);border-radius:4px}
.per-pick span{font-size:10.5px;color:var(--n400)}

/* ── COLLAPSIBLE DASHBOARD SECTIONS ─────────── */
.dsec{margin-bottom:10px;border:1.5px solid var(--n200);border-radius:var(--r12);
  background:var(--W);overflow:hidden}
.dsec[open]{box-shadow:var(--xs)}
.dsec-s{cursor:pointer;padding:12px 16px;display:flex;align-items:center;gap:9px;
  font-size:13px;font-weight:700;color:var(--n800);list-style:none;
  user-select:none;transition:background .13s}
.dsec-s::-webkit-details-marker{display:none}
.dsec-s:hover{background:var(--n50)}
.dsec-s:focus-visible{outline:2px solid var(--g);outline-offset:-2px}
.dsec-c{width:7px;height:7px;border-right:2px solid var(--n400);border-bottom:2px solid var(--n400);
  transform:rotate(-45deg);transition:transform .18s;flex-shrink:0;margin-left:2px}
.dsec[open]>.dsec-s .dsec-c{transform:rotate(45deg)}
.dsec-h{margin-left:auto;font-size:10.5px;font-weight:500;color:var(--n400);
  text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dsec-b{padding:4px 14px 14px;border-top:1px solid var(--n100)}
@media(max-width:640px){.dsec-h{display:none}}

/* ── DARK MODE ──────────────────────────────── */
[data-theme="dark"]{
  --W:#1e293b;
  --n50:#0f172a;--n100:#1e293b;--n200:#334155;--n300:#475569;
  --n600:#cbd5e1;--n700:#e2e8f0;--n800:#f1f5f9;--n900:#f8fafc;
  --gl:rgba(0,179,134,.14);--rl:rgba(220,38,38,.14);--bl:rgba(37,99,235,.14);
  --ol:rgba(217,119,6,.14);--pl:rgba(124,58,237,.14);--tl:rgba(13,148,136,.14);
  --xs:0 1px 3px rgba(0,0,0,.35);--sm:0 2px 8px rgba(0,0,0,.45);
}
[data-theme="dark"] body{background:var(--n50);color:var(--n900)}
[data-theme="dark"] .card{box-shadow:0 1px 3px rgba(0,0,0,.35)}
[data-theme="dark"] .topbar,[data-theme="dark"] .sb{background:var(--W);border-color:var(--n100)}
[data-theme="dark"] .tw{background:var(--W);border-color:var(--n200)}
[data-theme="dark"] table thead tr{background:rgba(255,255,255,.04)}
[data-theme="dark"] table td{border-bottom-color:rgba(255,255,255,.05)}
[data-theme="dark"] table tbody tr:hover td{background:rgba(255,255,255,.03)!important}
[data-theme="dark"] .tft td{background:rgba(255,255,255,.05)!important}
[data-theme="dark"] input,[data-theme="dark"] select,[data-theme="dark"] textarea{background:var(--n50)!important;color:var(--n900)!important;border-color:var(--n200)!important}
[data-theme="dark"] .mchip{background:var(--n100);border-color:var(--n200);color:var(--n600)}
[data-theme="dark"] .mchip.on{background:var(--g);color:#fff;border-color:var(--g)}
[data-theme="dark"] .btn-s{background:var(--n100);border-color:var(--n200);color:var(--n700)}
[data-theme="dark"] .btn-s:hover{background:var(--n200)}
[data-theme="dark"] .bic{background:var(--n100);border-color:var(--n200)}
[data-theme="dark"] .bic:hover{background:var(--n200)}
[data-theme="dark"] .modal{background:var(--W)}
[data-theme="dark"] .pm-cc{background:rgba(146,64,14,.3);color:#fcd34d}
[data-theme="dark"] .pm-upi{background:rgba(6,95,70,.3);color:#6ee7b7}
[data-theme="dark"] .pm-neft{background:rgba(30,64,175,.3);color:#93c5fd}
[data-theme="dark"] .pm-cash{background:rgba(55,65,81,.4);color:#d1d5db}
[data-theme="dark"] .pm-dc{background:rgba(91,33,182,.3);color:#c4b5fd}
[data-theme="dark"] .pm-wallet{background:rgba(157,23,77,.3);color:#f9a8d4}
[data-theme="dark"] .tag.tx{background:var(--n200);color:var(--n600)}
[data-theme="dark"] .prog{background:var(--n200)}
[data-theme="dark"] .sr{border-bottom-color:var(--n200)}
[data-theme="dark"] .bulk-bar{background:rgba(0,179,134,.12);border-color:rgba(0,179,134,.25)}

/* ── QUICK ADD ──────────────────────────────── */
.qa-btn{position:fixed;bottom:28px;right:28px;width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,var(--g),var(--gd));color:#fff;border:none;cursor:pointer;box-shadow:0 4px 16px rgba(0,179,134,.45);display:flex;align-items:center;justify-content:center;z-index:900;transition:transform .2s,box-shadow .2s;font-size:26px;line-height:1}
.qa-btn:hover{transform:scale(1.1);box-shadow:0 6px 22px rgba(0,179,134,.55)}
.qa-overlay{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:1500;backdrop-filter:blur(3px);animation:fadeIn .18s ease}
.qa-sheet{position:fixed;bottom:0;left:0;right:0;z-index:1600;background:var(--W);border-radius:22px 22px 0 0;padding:0 0 32px;box-shadow:0 -6px 28px rgba(0,0,0,.18);animation:qaUp .24s cubic-bezier(.34,1.15,.64,1)}
@keyframes qaUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.qa-handle{width:40px;height:4px;background:var(--n200);border-radius:99px;margin:12px auto 16px}

.budget-warn{background:var(--ol)!important;color:var(--o)!important;border-left:3px solid var(--o)!important}
.budget-over{background:var(--rl)!important;color:var(--r)!important;border-left:3px solid var(--r)!important}

.pm-upi{background:#d1fae5;color:#065f46}
.pm-neft{background:#dbeafe;color:#1e40af}

.major-flag{display:inline-flex;align-items:center;gap:3px;padding:1px 6px;border-radius:99px;font-size:9.5px;font-weight:700;background:#fef3c7;color:#92400e;border:1px solid #fcd34d}

.ai-card{border-radius:var(--r12);position:relative;overflow:hidden}

@keyframes aiGlow{from{box-shadow:0 0 12px rgba(124,58,237,.1),0 0 24px rgba(0,179,134,.05)}to{box-shadow:0 0 20px rgba(124,58,237,.18),0 0 40px rgba(0,179,134,.1)}}
.ai-typing{display:inline-flex;gap:4px;align-items:center;padding:8px 0}
.ai-typing span{width:6px;height:6px;border-radius:50%;background:var(--p);opacity:.4;animation:aiDot 1.4s ease-in-out infinite}
.ai-typing span:nth-child(2){animation-delay:.2s}
.ai-typing span:nth-child(3){animation-delay:.4s}
@keyframes aiDot{0%,80%,100%{transform:scale(1);opacity:.4}40%{transform:scale(1.3);opacity:1}}

.ai-prompt-btn:hover{border-color:var(--p);background:var(--pl);color:var(--p);transform:translateY(-1px);box-shadow:var(--sm)}
.ai-prompt-btn.active{border-color:var(--p);background:var(--pl);color:var(--p)}
.ai-prompt-ic{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;flex-shrink:0;font-size:13px}
.ai-result{font-size:13px;line-height:1.7;color:var(--n700);white-space:pre-wrap}
.ai-result strong{color:var(--n900);font-weight:700}
.ai-section{margin-bottom:16px;padding:14px 16px;border-radius:var(--r8);border:1px solid var(--n100);background:var(--W)}
.ai-section-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--p);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.ai-chat-input{display:flex;gap:8px;padding:12px;border-top:1px solid var(--n100);background:var(--n50);border-radius:0 0 var(--r12) var(--r12)}
.ai-chat-input input{flex:1;padding:9px 13px;border:1.5px solid var(--n200);border-radius:99px;font-size:13px;font-family:var(--f);outline:none;transition:border-color .15s}
.ai-chat-input input:focus{border-color:var(--p);box-shadow:0 0 0 3px rgba(124,58,237,.1)}
.ai-msg{padding:10px 14px;border-radius:var(--r8);margin-bottom:8px;max-width:92%;animation:fadein .2s ease both}
.ai-msg.user{background:var(--gl);color:var(--gd);margin-left:auto;border-bottom-right-radius:4px}
.ai-msg.bot{background:var(--pl);color:var(--n800);margin-right:auto;border-bottom-left-radius:4px}

// Generate period months dynamically from profile
function getPeriodMonths(start, end) {
  const months = [];
  let [sy, sm] = start.split('-').map(Number);
  const [ey, em] = end.split('-').map(Number);
  while (sy < ey || sy === ey && sm <= em) {
    const key = `${sy}-${String(sm).padStart(2, '0')}`;
    const d = new Date(sy, sm - 1);
    const label = d.toLocaleString('en-IN', {
      month: 'short',
      year: '2-digit'
    }).replace(' ', '-');
    months.push({
      key,
      label
    });
    sm++;
    if (sm > 12) {
      sm = 1;
      sy++;
    }
  }
  return months;

/* ══════════════════════════════════════════════════════════
   GOOGLE DRIVE INTEGRATION
   ─────────────────────────────────────────────────────────
   HOW IT WORKS:
   1. User clicks "Connect Google Drive"
   2. Google OAuth2 popup → user grants permission
   3. We get an access token (valid ~1 hour)
   4. Save: POST multipart to Drive API → creates/updates
      "fundflow-data.json" in user's Google Drive root
   5. Load: GET file list → find fundflow-data.json → GET content
   6. Token refreshes silently via GIS token client

   SETUP REQUIRED (one-time by developer):
   → Go to console.cloud.google.com
   → Create project → Enable Google Drive API
   → OAuth consent screen → Add scope: drive.file
   → Create OAuth 2.0 Web Client ID
   → Add your GitHub Pages URL to Authorized JavaScript Origins
   → Paste Client ID into GOOGLE_CLIENT_ID below
══════════════════════════════════════════════════════════ */

// ▼▼▼ Google Client ID: can be set via UI or hardcoded here ▼▼▼
let GOOGLE_CLIENT_ID = (() => {
  try {
    return localStorage.getItem('fm_google_client_id') || 'YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com';
  } catch {
    return 'YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com';
  }
})();
// ▲▲▲ ──────────────────────────────────────────────────────── ▲▲▲

const DRIVE_FILENAME = 'finmanager-data.json';
const DRIVE_FOLDER = 'PersonalFinManager';
const DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.file';
const SESS_KEY = 'fm_gdrive_tok';
const DriveService = {
  _token: null,
  _client: null,
  _fileId: null,
  _folderId: null,
  _initPromise: null,
  /* ── session helpers: survive F5 within the same browser tab ── */
  _saveSess(tok, ttl = 3500) {
    try {
      sessionStorage.setItem(SESS_KEY, JSON.stringify({
        tok,
        exp: Date.now() + ttl * 1000
      }));
    } catch (_) {}
  },
  _loadSess() {
    try {
      const raw = sessionStorage.getItem(SESS_KEY);
      if (!raw) return null;
      const {
        tok,
        exp
      } = JSON.parse(raw);
      if (Date.now() < exp) return tok;
      sessionStorage.removeItem(SESS_KEY);
    } catch (_) {}
    return null;
  },
  _clearSess() {
    try {
      sessionStorage.removeItem(SESS_KEY);
    } catch (_) {}
  },
  init(forceReinit) {
    if (this._initPromise && !forceReinit) return this._initPromise;
    this._initPromise = new Promise(resolve => {
      let tries = 0;
      const poll = () => {
        tries++;
        if (window.google?.accounts?.oauth2) {
          try {
            this._client = window.google.accounts.oauth2.initTokenClient({
              client_id: GOOGLE_CLIENT_ID,
              scope: DRIVE_SCOPE,
              callback: () => {}
            });
            // 1. Restore from sessionStorage (survives page refresh)
            const cached = this._loadSess();
            if (cached) {
              this._token = cached;
              resolve({
                ok: true,
                restored: true
              });
              return;
            }
            // 2. Silent re-auth via existing Google browser session (no popup)
            this._silentToken().then(t => {
              this._token = t;
              resolve({
                ok: true,
                restored: true
              });
            }).catch(() => resolve({
              ok: true,
              restored: false
            }));
          } catch (e) {
            resolve({
              ok: false,
              error: e.message
            });
          }
        } else if (tries < 30) {
          setTimeout(poll, 500);
        } else {
          resolve({
            ok: false,
            error: 'Google Identity Services failed to load.'
          });
        }
      };
      poll();
    });
    return this._initPromise;
  },
  /* Silent token: uses existing Google session cookie, never shows a popup */
  _silentToken() {
    return new Promise((resolve, reject) => {
      if (!this._client) {
        reject(new Error('not ready'));
        return;
      }
      const guard = setTimeout(() => reject(new Error('timeout')), 6000);
      this._client.callback = resp => {
        clearTimeout(guard);
        if (resp.error) {
          reject(new Error(resp.error));
          return;
        }
        this._saveSess(resp.access_token);
        resolve(resp.access_token);
      };
      this._client.requestAccessToken({
        prompt: ''
      }); // no popup
    });
  },

  /* Explicit connect: prompt:'' uses existing Google session; GIS falls back to picker if needed */
  getToken() {
    return new Promise((resolve, reject) => {
      if (!this._client) {
        reject(new Error('GIS not initialised.'));
        return;
      }
      this._client.callback = resp => {
        if (resp.error) {
          reject(new Error(`Google auth error: ${resp.error}`));
          return;
        }
        this._token = resp.access_token;
        this._saveSess(resp.access_token);
        resolve(resp.access_token);
      };
      this._client.requestAccessToken({
        prompt: ''
      });
    });
  },
  /* Auto-retry: silently refresh token then retry the original Drive call */
  async _withAutoRefresh(fn) {
    try {
      return await fn();
    } catch (e) {

        this._token = await this._silentToken();

  _expired(res) {

  async ensureFolder() {

      headers: this._hdrs()

      this._folderId = json.files[0].id;

    }

      method: 'POST',
      headers: this._hdrs({
        'Content-Type': 'application/json'
      }),

        name: DRIVE_FOLDER,
        mimeType: 'application/vnd.google-apps.folder'

    return this._folderId;
  },
  async findFile() {
    const folderId = await this.ensureFolder();
    const q = encodeURIComponent(`name='${DRIVE_FILENAME}' and '${folderId}' in parents and trashed=false`);
    const res = await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name,modifiedTime)&spaces=drive`, {
      headers: this._hdrs()
    });
    if (this._expired(res)) throw new Error('TOKEN_EXPIRED');
    if (!res.ok) throw new Error(`Drive search failed: ${res.status}`);
    const json = await res.json();
    if (json.files?.length > 0) {
      this._fileId = json.files[0].id;
      return json.files[0];
    }

    return null;
  },
  async save(dataObj) {
    await this.findFile();

      ...dataObj,

      const res = await fetch(`https://www.googleapis.com/upload/drive/v3/files/${this._fileId}?uploadType=media`, {
        method: 'PATCH',
        headers: this._hdrs({
          'Content-Type': 'application/json'
        }),
        body
      });
      if (this._expired(res)) throw new Error('TOKEN_EXPIRED');
      if (!res.ok) throw new Error(`Drive update failed: ${res.status}`);
      return this._fileId;
    } else {
      const folderId = await this.ensureFolder();
      const boundary = '-------fm_' + Date.now();
      const meta = 'Content-Type: application/json; charset=UTF-8\r\n\r\n' + JSON.stringify({
        name: DRIVE_FILENAME,
        mimeType: 'application/json',
        parents: [folderId]
      });
      const dat = 'Content-Type: application/json\r\n\r\n' + body;
      const res = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', {
        method: 'POST',
        headers: this._hdrs({
          'Content-Type': `multipart/related; boundary="${boundary}"`
        }),
        body: `\r\n--${boundary}\r\n${meta}\r\n--${boundary}\r\n${dat}\r\n--${boundary}--`
      });
      if (this._expired(res)) throw new Error('TOKEN_EXPIRED');
      if (!res.ok) throw new Error(`Drive create failed: ${res.status}`);
      const json = await res.json();
      this._fileId = json.id;
      return json.id;
    }
  },
  async load() {
    const file = await this.findFile();
    if (!file) return null;
    const res = await fetch(`https://www.googleapis.com/drive/v3/files/${file.id}?alt=media`, {
      headers: this._hdrs({
        Accept: 'application/json'
      })
    });
    if (this._expired(res)) throw new Error('TOKEN_EXPIRED');
    if (!res.ok) throw new Error(`Drive download failed: ${res.status}`);
    const loaded = await res.json();
    return {
      data: loaded,
      modifiedTime: file.modifiedTime,
      syncedAt: loaded._lastSyncedAt || null
    };
  },
  disconnect() {
    if (this._token && window.google?.accounts?.oauth2) {
      try {
        window.google.accounts.oauth2.revoke(this._token, () => {});
      } catch (_) {}
    }
    this._token = null;
    this._fileId = null;
    this._folderId = null;
    this._clearSess();
  }
};
