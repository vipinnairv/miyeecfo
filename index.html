<script>
/* ── FONT PREFERENCE ──────────────────────────────────────────────
   Runs before React mounts, so the chosen font is applied on the very
   first paint (no flash of the wrong font). Privacy-first: Verdana and
   Calibri are already on the device and load nothing; Poppins and Google
   Sans fetch a web font ONLY when the user actually selects them. Stored
   in localStorage only — it is a per-device preference, never part of the
   financial data export. */
(function(){
  var F={
    verdana   :{label:'Verdana (Default)',stack:"Verdana,Geneva,'DejaVu Sans',sans-serif"},
    calibri   :{label:'Calibri',          stack:"Calibri,'Segoe UI',Candara,Optima,'Trebuchet MS',sans-serif"},
    poppins   :{label:'Poppins',          stack:"'Poppins','Segoe UI',sans-serif",
                web:'https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap'},
    // 'Google Sans' is not a public web font; it renders for users who have it
    // installed, and everyone else falls back to Roboto (Google's system face),
    // which we load so the option always looks the part.
    googlesans:{label:'Google Sans',      stack:"'Google Sans','Product Sans','Roboto','Segoe UI',sans-serif",
                web:'https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap'}
  };
  function apply(key){
    var f=F[key]||F.verdana;
    document.documentElement.style.setProperty('--f',f.stack);
    if(f.web&&!document.querySelector('link[data-font="'+key+'"]')){
      var l=document.createElement('link');
      l.rel='stylesheet';l.href=f.web;l.setAttribute('data-font',key);
      document.head.appendChild(l);
    }
  }
  window.FONTS=F;
  window.applyFont=apply;
  try{apply(localStorage.getItem('fm_font')||'verdana');}catch(e){}
})();
</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --g:#00b386;--gd:#007a62;--gl:#e6f9f4;--gxl:#f0fdf9;
  --b:#2563eb;--bl:#eff6ff;--bd:#1e40af;
  --r:#dc2626;--rl:#fef2f2;
  --o:#d97706;--ol:#fffbeb;
  --p:#7c3aed;--pl:#f5f3ff;
  --t:#0d9488;--tl:#f0fdfa;
  --n50:#f8fafc;--n100:#f1f5f9;--n200:#e2e8f0;--n300:#cbd5e1;
  --n400:#94a3b8;--n500:#64748b;--n600:#475569;--n700:#334155;--n800:#1e293b;--n900:#0f172a;
  --W:#fff;
  --xs:0 1px 2px rgba(0,0,0,.04);
  --sm:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.05);
  --md:0 4px 6px -1px rgba(0,0,0,.07),0 2px 4px -2px rgba(0,0,0,.04);
  --lg:0 10px 15px -3px rgba(0,0,0,.08),0 4px 6px -4px rgba(0,0,0,.04);
  --xl:0 20px 25px -5px rgba(0,0,0,.08),0 8px 10px -6px rgba(0,0,0,.04);
  --r4:4px;--r6:6px;--r8:8px;--r12:12px;--r16:16px;--r20:20px;
  /* Verdana is a system font — no webfont request, renders identically offline.
     Figures keep a monospace face so columns of numbers stay aligned. */
  --f:Verdana,Geneva,'DejaVu Sans',sans-serif;--m:'JetBrains Mono',Consolas,monospace;
  --sb:220px;
}
html{scroll-behavior:smooth;overflow-x:hidden}
body{font-family:var(--f);background:var(--n50);color:var(--n900);line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
#root{display:flex;min-height:100vh;overflow-x:hidden}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--n200);border-radius:99px}

/* ── SIDEBAR ─────────────────────────────────── */
.sb{width:var(--sb);background:var(--W);border-right:1px solid var(--n100);position:fixed;inset:0 auto 0 0;display:flex;flex-direction:column;z-index:200;overflow-y:auto;overflow-x:hidden}
.sb-head{padding:13px 12px 10px;border-bottom:1px solid var(--n100);display:flex;align-items:center;gap:8px;flex-shrink:0}
.sb-mark{width:30px;height:30px;background:linear-gradient(135deg,var(--g),var(--gd));border-radius:9px;display:grid;place-items:center;flex-shrink:0;box-shadow:0 2px 6px rgba(0,179,134,.25)}
.sb-mark svg{width:16px;height:16px;fill:#fff}
.sb-app{font-weight:800;font-size:13px;color:var(--n900);letter-spacing:-.2px;line-height:1.2}
.sb-period{font-size:9px;color:var(--n400);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-nav{flex:1;padding:6px 0;overflow-y:auto}
.sb-group{padding:9px 11px 2px;font-size:8.5px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;color:var(--n400)}
.sb-item{display:flex;align-items:center;gap:7px;padding:7px 9px;margin:1px 4px;border-radius:var(--r6);cursor:pointer;font-size:12px;font-weight:500;color:var(--n500);transition:all .13s;position:relative;user-select:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-item:hover{background:var(--n50);color:var(--n800)}
.sb-item.on{background:var(--gl);color:var(--gd);font-weight:700}
.sb-item.on::before{content:'';position:absolute;left:-4px;top:50%;transform:translateY(-50%);width:3px;height:16px;background:var(--g);border-radius:0 3px 3px 0}
.sb-ic{width:14px;height:14px;flex-shrink:0;opacity:.65}
.sb-item.on .sb-ic{opacity:1}
.sb-badge{margin-left:auto;font-size:9px;font-weight:700;background:var(--r);color:#fff;padding:1px 5px;border-radius:99px;min-width:16px;text-align:center;flex-shrink:0}
.sb-foot{padding:8px 7px;border-top:1px solid var(--n100);flex-shrink:0}
.sb-user{display:flex;align-items:center;gap:8px;padding:6px;border-radius:var(--r8);cursor:pointer;transition:background .13s}
.sb-user:hover{background:var(--n50)}
.sb-av{width:28px;height:28px;background:linear-gradient(135deg,#667eea,#764ba2);border-radius:50%;display:grid;place-items:center;font-size:10.5px;font-weight:700;color:#fff;flex-shrink:0}
.sb-uname{font-size:11.5px;font-weight:600;color:var(--n700)}
.sb-uemail{font-size:9.5px;color:var(--n400);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:140px}

/* ── MAIN ───────────────────────────────────── */
.main{margin-left:var(--sb);flex:1;min-width:0;display:flex;flex-direction:column;min-height:100vh;overflow-x:hidden;max-width:calc(100vw - var(--sb))}
.topbar{background:var(--W);border-bottom:1px solid var(--n100);height:50px;padding:0 18px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:var(--xs)}
.tb-left{display:flex;align-items:center;gap:8px}
.tb-title{font-size:13.5px;font-weight:700;color:var(--n900)}
.tb-right{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.page{padding:16px 18px 40px;flex:1;max-width:1380px;width:100%}

/* ── CARD ───────────────────────────────────── */
.card{background:var(--W);border:1px solid var(--n100);border-radius:var(--r12);padding:14px 16px;box-shadow:var(--xs);transition:box-shadow .13s;min-width:0;overflow:hidden}
.card:hover{box-shadow:var(--sm)}
.card.flat{box-shadow:none}
.cl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--n400);margin-bottom:4px}
.cv{font-size:20px;font-weight:800;font-family:var(--m);color:var(--n900);line-height:1.15;letter-spacing:-.6px}
.cv.g{color:var(--gd)} .cv.r{color:var(--r)} .cv.o{color:var(--o)} .cv.b{color:var(--b)} .cv.p{color:var(--p)}
.cm{font-size:11px;color:var(--n400);margin-top:3px}
.ci{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;margin-bottom:10px}
.ci svg{width:18px;height:18px}

/* ── GRIDS ──────────────────────────────────── */
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.row{display:flex;gap:12px;min-width:0}
.col{flex:1;min-width:0}
.mb1{margin-bottom:5px}.mb2{margin-bottom:10px}.mb3{margin-bottom:16px}.mb4{margin-bottom:22px}

/* ── TABLE ──────────────────────────────────── */
.tw{overflow-x:auto;border-radius:var(--r12);border:1px solid var(--n100);background:var(--W)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
thead tr{background:var(--n50);border-bottom:1px solid var(--n100)}
th{padding:9px 12px;text-align:left;font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--n500);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--n50);color:var(--n700);vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr:hover td{background:#fafbfc}
.num{font-family:var(--m);text-align:right;font-size:12px}
.pos{color:var(--gd);font-weight:600}.neg{color:var(--r);font-weight:600}
.tft td{background:var(--n50)!important;font-weight:700;border-top:2px solid var(--n200)}

/* ── PROGRESS ───────────────────────────────── */
.prog{height:5px;background:var(--n100);border-radius:99px;overflow:hidden}
.pf{height:100%;border-radius:99px;transition:width .5s ease}

/* ── TAGS ───────────────────────────────────── */
.tag{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:99px;font-size:10.5px;font-weight:600;white-space:nowrap}
.tg{background:var(--gl);color:var(--gd)}.tr{background:var(--rl);color:var(--r)}
.tb{background:var(--bl);color:var(--bd)}.to{background:var(--ol);color:var(--o)}
.tx{background:var(--n100);color:var(--n500)}.tp{background:var(--pl);color:var(--p)}

/* ── FORM ───────────────────────────────────── */
.fg{display:flex;flex-direction:column;gap:4px;min-width:0}
.fg-full{grid-column:1/-1}
.fg label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--n500)}
.fg input,.fg select,.fg textarea{padding:8px 11px;border:1.5px solid var(--n200);border-radius:var(--r6);font-size:13px;font-family:var(--f);color:var(--n900);background:var(--W);outline:none;transition:border-color .13s,box-shadow .13s;width:100%}
.fg input:focus,.fg select:focus{border-color:var(--g);box-shadow:0 0 0 3px rgba(0,179,134,.1)}
.f2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.f3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.f4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}

/* ── BUTTONS ─────────────────────────────────── */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:var(--r6);font-size:12.5px;font-weight:600;font-family:var(--f);cursor:pointer;border:none;transition:all .13s;white-space:nowrap;line-height:1}
.btn svg{width:13px;height:13px;flex-shrink:0}
.btn-p{background:var(--g);color:#fff;box-shadow:0 1px 3px rgba(0,179,134,.25)}
.btn-p:hover{background:var(--gd)}
.btn-s{background:var(--W);color:var(--n700);border:1.5px solid var(--n200)}
.btn-s:hover{background:var(--n50);border-color:var(--n300)}
.btn-d{background:var(--rl);color:var(--r)}
.btn-d:hover{background:var(--r);color:#fff}
.btn-g{background:transparent;color:var(--n500);padding:5px 8px}
.btn-g:hover{background:var(--n100);color:var(--n700)}
.btn-sm{padding:5px 10px;font-size:11.5px}
.bic{padding:6px;border-radius:var(--r6);background:var(--n50);border:1px solid var(--n200);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:all .13s;color:var(--n500)}
.bic:hover{background:var(--n100);color:var(--n700)}
.bic svg{width:12px;height:12px}
.bic.red{color:var(--r)}
.bic.red:hover{background:var(--r);color:#fff}

/* ── TOGGLE ─────────────────────────────────── */
.tgl{display:flex;background:var(--n100);border-radius:99px;padding:3px;gap:2px}
.tgo{padding:5px 12px;border-radius:99px;font-size:11.5px;font-weight:600;cursor:pointer;border:none;background:transparent;color:var(--n500);transition:all .13s;font-family:var(--f)}
.tgo.on{background:var(--W);color:var(--gd);box-shadow:var(--xs)}

/* ── MODAL ──────────────────────────────────── */
.ov{position:fixed;inset:0;background:rgba(15,23,42,.45);backdrop-filter:blur(3px);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--W);border-radius:var(--r16);box-shadow:var(--xl);width:100%;max-width:600px;max-height:92vh;overflow-y:auto}
.mh{padding:18px 20px 0;display:flex;align-items:center;justify-content:space-between}
.mt{font-size:15px;font-weight:700}
.mb{padding:14px 20px}
.mf{padding:0 20px 18px;display:flex;justify-content:flex-end;gap:8px}

/* ── SECTION HEADER ─────────────────────────── */
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.sh-t{font-size:13px;font-weight:700;color:var(--n900);display:flex;align-items:center;gap:7px}

/* ── ALERTS ──────────────────────────────────── */
.alert{display:flex;align-items:flex-start;gap:9px;padding:10px 12px;border-radius:var(--r8);font-size:12px;margin-bottom:12px}
.alert svg{width:14px;height:14px;flex-shrink:0;margin-top:1px}
.aw{background:var(--ol);color:#92400e;border-left:3px solid var(--o)}
.ai{background:var(--bl);color:var(--bd);border-left:3px solid var(--b)}
.as{background:var(--gl);color:var(--gd);border-left:3px solid var(--g)}
.ae{background:var(--rl);color:var(--r);border-left:3px solid var(--r)}

/* ── TOAST ──────────────────────────────────── */
.toast{position:fixed;bottom:20px;right:20px;z-index:2000;color:#fff;padding:10px 15px;border-radius:var(--r8);font-size:12.5px;font-weight:500;box-shadow:var(--xl);display:flex;align-items:center;gap:8px;animation:tin .22s ease}
@keyframes tin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.toast.g{background:var(--gd)}.toast.r{background:var(--r)}.toast.x{background:var(--n800)}.toast.o{background:var(--o)}.toast.b{background:var(--bd)}
.toast-act{margin-left:6px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);
  color:#fff;font-family:var(--f);font-size:11.5px;font-weight:700;padding:4px 11px;
  border-radius:99px;cursor:pointer;transition:background .13s;white-space:nowrap}
.toast-act:hover{background:rgba(255,255,255,.32)}
.toast-act:focus-visible{outline:2px solid #fff;outline-offset:2px}

/* ── DONUT ──────────────────────────────────── */
.donut{position:relative;display:inline-flex;align-items:center;justify-content:center}
.donut-c{position:absolute;text-align:center;pointer-events:none}

/* ── STAT ROW ───────────────────────────────── */
.sr{display:flex;align-items:center;justify-content:space-between;padding:7.5px 0;border-bottom:1px solid var(--n50)}
.sr:last-child{border-bottom:none}
.sr-l{font-size:12.5px;color:var(--n600)}
.sr-v{font-family:var(--m);font-size:12.5px;font-weight:600}

/* ── CC DUE CARDS ─────────────────────────────── */
.due-card{border-radius:var(--r12);padding:14px 16px;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:8px}
.due-card::before{content:'';position:absolute;right:-15px;top:-15px;width:80px;height:80px;background:rgba(255,255,255,.1);border-radius:50%}
.due-urgency{display:flex;align-items:center;justify-content:space-between}
.due-days-badge{padding:3px 10px;border-radius:99px;font-size:10px;font-weight:700;backdrop-filter:blur(4px)}
.due-bank{font-size:10px;font-weight:700;opacity:.7;letter-spacing:.5px;text-transform:uppercase}
.due-card-type{font-size:13px;font-weight:700;margin-top:1px}
.due-amount-row{display:flex;justify-content:space-between;align-items:flex-end}
.due-amount{font-family:var(--m);font-size:18px;font-weight:800}
.due-date-block{text-align:right}
.due-date-label{font-size:9px;opacity:.65;text-transform:uppercase;letter-spacing:.5px}
.due-date-val{font-size:12px;font-weight:700}

/* ── ACCOUNT ROW ───────────────────────────── */
.acc-row{display:flex;align-items:center;gap:11px;padding:9px 0;border-bottom:1px solid var(--n50)}
.acc-row:last-child{border-bottom:none}
.acc-ic{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;flex-shrink:0;font-size:10px;font-weight:700}
.acc-name{font-size:12.5px;font-weight:600;color:var(--n800)}
.acc-no{font-size:10px;color:var(--n400);font-family:var(--m)}
.acc-bal{margin-left:auto;text-align:right}
.acc-num{font-family:var(--m);font-size:13px;font-weight:700}

/* ── MONTH CHIPS ────────────────────────────── */
.mbar{display:flex;gap:4px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;scrollbar-width:none}
.mbar::-webkit-scrollbar{display:none}
.mchip{padding:5px 11px;border-radius:99px;font-size:11.5px;font-weight:600;cursor:pointer;white-space:nowrap;border:1.5px solid var(--n200);background:var(--W);color:var(--n500);transition:all .13s;flex-shrink:0;font-family:var(--f);line-height:1.35}
.mchip.on{background:var(--g);color:#fff;border-color:var(--g);box-shadow:0 2px 6px rgba(0,179,134,.25)}
.mchip:hover:not(.on){border-color:var(--g);color:var(--gd)}
.mchip:focus-visible{outline:2px solid var(--g);outline-offset:2px}

/* ── DASHBOARD SPECIAL ──────────────────────── */
.hero{background:linear-gradient(135deg,#0a2540 0%,#1a4a6e 45%,#0d6e5a 100%);border-radius:var(--r16);padding:22px 24px;color:#fff;margin-bottom:16px;position:relative;overflow:hidden}
.hero::after{content:'';position:absolute;right:-40px;top:-40px;width:200px;height:200px;background:rgba(0,179,134,.12);border-radius:50%}
.hero::before{content:'';position:absolute;right:80px;bottom:-60px;width:160px;height:160px;background:rgba(255,255,255,.04);border-radius:50%}
.hero-label{font-size:11px;opacity:.65;text-transform:uppercase;letter-spacing:.8px;margin-bottom:4px}
.hero-amount{font-family:var(--m);font-size:32px;font-weight:800;letter-spacing:-1.5px;line-height:1}
.hero-sub{font-size:11.5px;opacity:.6;margin-top:5px}
.hero-pills{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;position:relative;z-index:1}
.hero-pill{background:rgba(255,255,255,.12);backdrop-filter:blur(4px);border:1px solid rgba(255,255,255,.15);border-radius:var(--r8);padding:8px 12px;min-width:100px}
.hero-pill-label{font-size:9px;opacity:.6;text-transform:uppercase;letter-spacing:.5px;margin-bottom:2px}
.hero-pill-val{font-family:var(--m);font-size:14px;font-weight:700}
.hero-pill-val.gr{color:#6ee7b7}
.hero-pill-val.rd{color:#fca5a5}
.hero-pill-val.yw{color:#fcd34d}

/* ── KPI CARD SPECIAL ───────────────────────── */
.kpi-card{background:var(--W);border:1px solid var(--n100);border-radius:var(--r12);padding:16px 18px;box-shadow:var(--xs);position:relative;overflow:hidden;transition:all .15s}
.kpi-card:hover{box-shadow:var(--md);transform:translateY(-1px)}
.kpi-card::after{content:'';position:absolute;right:-20px;top:-20px;width:70px;height:70px;border-radius:50%;opacity:.06}
.kpi-card.g::after{background:var(--g)}
.kpi-card.r::after{background:var(--r)}
.kpi-card.o::after{background:var(--o)}
.kpi-card.b::after{background:var(--b)}
.kpi-ic-wrap{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.kpi-ic{width:36px;height:36px;border-radius:9px;display:grid;place-items:center}
.kpi-ic svg{width:17px;height:17px}
.kpi-trend{font-size:10px;font-weight:700;padding:3px 8px;border-radius:99px}

/* ── CHART BARS ─────────────────────────────── */
.barchart{display:flex;align-items:flex-end;gap:3px;padding-top:8px}
.barcol{flex:1;display:flex;flex-direction:column;align-items:center}
.barpair{display:flex;gap:1.5px;align-items:flex-end;width:100%}
.bar{flex:1;border-radius:2px 2px 0 0;min-height:2px;transition:height .4s ease;cursor:pointer}
.bar:hover{opacity:.8}
.bar-lbl{font-size:8.5px;color:var(--n400);margin-top:3px;white-space:nowrap}

/* ── DIVIDER ─────────────────────────────────── */
.div{height:1px;background:var(--n100);margin:14px 0}

/* ── PAGE HEADER ────────────────────────────── */
.ph{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:16px}
.ptitle{font-size:19px;font-weight:800;color:var(--n900);letter-spacing:-.4px}
.psub{font-size:12px;color:var(--n400);margin-top:2px}

/* ── UTILITY ────────────────────────────────── */
.flex{display:flex}.ic{align-items:center}.jb{justify-content:space-between}.g1{gap:5px}.g2i{gap:9px}.g3i{gap:13px}
.xs{font-size:10.5px}.sm{font-size:12px}
.muted{color:var(--n400)}.bold{font-weight:700}.mono{font-family:var(--m)}
.tr{text-align:right}.w100{width:100%}
.mt1{margin-top:4px}.mt2{margin-top:8px}.mt3{margin-top:13px}
@keyframes fadein{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.page>*{animation:fadein .2s ease both}
/* ── MOBILE BOTTOM NAV (base — hidden by default, shown via media query below) ── */
.mob-nav{display:none;position:fixed;bottom:0;left:0;right:0;height:58px;
  background:var(--W);border-top:1.5px solid var(--n200);z-index:300;
  align-items:stretch;box-shadow:0 -2px 10px rgba(0,0,0,.07)}
.mob-nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:3px;font-size:9px;font-weight:600;
  color:var(--n400);cursor:pointer;border:none;background:none;
  padding:0;font-family:var(--f);transition:color .13s}
.mob-nav-btn.on{color:var(--g)}
/* ── MOBILE MORE DRAWER (base) ── */
.mob-drawer-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:400}
.mob-drawer-overlay.open{display:block}
.mob-drawer{position:fixed;bottom:58px;left:0;right:0;background:var(--W);border-radius:20px 20px 0 0;
  z-index:401;max-height:72vh;overflow-y:auto;padding:8px 0 12px;
  box-shadow:0 -4px 24px rgba(0,0,0,.15);
  transform:translateY(100%);transition:transform .22s cubic-bezier(.4,0,.2,1)}
.mob-drawer.open{transform:translateY(0)}
.mob-drawer-handle{width:36px;height:4px;background:var(--n200);border-radius:4px;margin:6px auto 14px}
.mob-drawer-section{padding:0 16px 6px}
.mob-drawer-label{font-size:9.5px;font-weight:700;color:var(--n300);letter-spacing:.8px;
  text-transform:uppercase;padding:8px 4px 4px}
.mob-drawer-item{display:flex;align-items:center;gap:10px;padding:11px 8px;
  border-radius:8px;cursor:pointer;font-size:13px;font-weight:500;color:var(--n500);
  border:none;background:none;width:100%;text-align:left;font-family:var(--f)}
.mob-drawer-item:active{background:var(--n50)}
.mob-drawer-item.on{color:var(--g);background:var(--gl);font-weight:700}
.mob-drawer-item .di{font-size:16px;width:22px;text-align:center}
/* ── RESPONSIVE BREAKPOINTS ────────── */
/* 1366px laptops: main area ≈ 1146px → g4 stays 4-col (286px each) — OK */
@media(max-width:1280px){
  .g4{grid-template-columns:repeat(2,1fr)}
  .page{padding:14px 16px 36px}
}
@media(max-width:1100px){
  .page{padding:12px 14px 32px}
  .g4{grid-template-columns:1fr 1fr}
  .g3{grid-template-columns:1fr 1fr}
  .tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .ph{flex-wrap:wrap;gap:8px}
}
@media(max-width:960px){
  .g3{grid-template-columns:1fr 1fr}
  .g2{grid-template-columns:1fr}
  .page{padding:10px 12px 28px}
}
@media(max-width:768px){
  :root{--sb:0px}

  .main{margin-left:0;max-width:100vw}
  .g4,.g3{grid-template-columns:1fr 1fr}
  .g2{grid-template-columns:1fr}
  .f3,.f4{grid-template-columns:1fr 1fr}
  .topbar{padding:6px 12px;height:46px}
  .tb-title{font-size:13px}
  .page{padding:10px 12px 76px}
  .mob-nav{display:flex}
  .tb-desktop{display:none!important}
  .qa-btn{bottom:70px;right:14px;width:46px;height:46px;font-size:22px}
  #gfooter{display:none!important}
}
@media(max-width:480px){
  .g4,.g3{grid-template-columns:1fr}
  .f2,.f3,.f4{grid-template-columns:1fr}
  .ph .btn{font-size:11px;padding:6px 10px}
  .page{padding:8px 10px 76px}
}
/* ── HERO BREAKUP (reads as an equation) ────── */
.hero-calc{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap;
  margin-top:16px;padding-top:14px;border-top:1px solid rgba(255,255,255,.1);
  position:relative;z-index:1}
.hero-term{min-width:78px}
.hero-term-l{font-size:9px;opacity:.5;text-transform:uppercase;letter-spacing:.6px;
  margin-bottom:3px;white-space:nowrap}
.hero-term-v{font-family:var(--m);font-size:13px;font-weight:700;white-space:nowrap}
.hero-op{font-family:var(--m);font-size:13px;font-weight:700;opacity:.4;
  padding-bottom:1px;flex-shrink:0}
@media(max-width:700px){
  .hero-calc{gap:7px}
  .hero-term{min-width:64px}
  .hero-term-v{font-size:11.5px}
  .hero-op{font-size:11px}
}

/* ── SHORT-TERM LIQUIDITY CARD ──────────────── */
/* Dedicated text tokens: --gd/--r are tuned for light surfaces and are also used as
   solid backgrounds elsewhere, so they cannot simply be brightened for dark mode. */
:root{--pos:#007a62;--neg:#dc2626;--warn:#b45309}
[data-theme="dark"]{--pos:#34d399;--neg:#f87171;--warn:#fbbf24}
.stl-card{border-left:3px solid var(--b)}
.stl-row{display:flex;gap:22px;align-items:flex-start;flex-wrap:wrap}
.stl-main{min-width:230px;flex:1}
.stl-val{font-family:var(--m);font-size:26px;font-weight:800;letter-spacing:-.8px;line-height:1.1}
.stl-sub{font-size:11.5px;color:var(--n500);margin-top:6px;line-height:1.5;max-width:420px}
.stl-calc{display:flex;align-items:flex-start;gap:9px;flex-wrap:wrap;
  padding:10px 14px;background:var(--n50);border:1px solid var(--n100);border-radius:var(--r8)}
.stl-term{min-width:74px}
.stl-term-l{font-size:9px;color:var(--n400);text-transform:uppercase;letter-spacing:.5px;
  margin-bottom:3px;white-space:nowrap}
.stl-term-v{font-family:var(--m);font-size:13px;font-weight:700;white-space:nowrap}
.stl-term-n{font-size:9px;color:var(--n400);margin-top:2px;white-space:nowrap;font-style:italic}
.stl-op{font-family:var(--m);font-size:13px;font-weight:700;color:var(--n300);margin-top:13px;flex-shrink:0}
.stl-foot{display:flex;gap:16px;flex-wrap:wrap;justify-content:space-between;
  margin-top:12px;padding-top:10px;border-top:1px dashed var(--n200);
  font-size:11px;color:var(--n500)}
@media(max-width:820px){
  .stl-row{gap:14px}
  .stl-calc{gap:7px;padding:9px 11px}
  .stl-term{min-width:62px}
  .stl-term-v{font-size:11.5px}
  .stl-val{font-size:22px}
}

/* ── SUB-PAGE TAB STRIP ─────────────────────── */
.tabs{display:flex;gap:2px;padding:0 20px;background:var(--W);
  border-bottom:1.5px solid var(--n200);overflow-x:auto;
  -webkit-overflow-scrolling:touch;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:9px 14px 8px;font-size:12.5px;font-weight:600;color:var(--n400);
  background:none;border:none;border-bottom:2.5px solid transparent;cursor:pointer;
  font-family:var(--f);white-space:nowrap;transition:color .13s,border-color .13s}
.tab:hover{color:var(--n700)}
.tab.on{color:var(--g);border-bottom-color:var(--g)}
.tab:focus-visible{outline:2px solid var(--g);outline-offset:-2px;border-radius:4px}
@media(max-width:768px){.tabs{padding:0 12px}.tab{font-size:11.5px;padding:8px 11px 7px}}

/* ── TOPBAR PERIOD PICKER ───────────────────── */
.per-pick{display:flex;align-items:center;gap:4px;background:var(--n50);
  border:1.5px solid var(--n200);border-radius:8px;padding:3px 7px}
.per-pick input{border:none;background:none;font-family:var(--m);font-size:11px;
  color:var(--n700);width:88px;padding:1px 2px;cursor:pointer}
.per-pick input:focus{outline:1.5px solid var(--g);border-radius:4px}
.per-pick span{font-size:10.5px;color:var(--n400)}

/* ── COLLAPSIBLE DASHBOARD SECTIONS ─────────── */
.dsec{margin-bottom:10px;border:1.5px solid var(--n200);border-radius:var(--r12);
  background:var(--W);overflow:hidden}
.dsec[open]{box-shadow:var(--xs)}
.dsec-s{cursor:pointer;padding:12px 16px;display:flex;align-items:center;gap:9px;
  font-size:13px;font-weight:700;color:var(--n800);list-style:none;
  user-select:none;transition:background .13s}
.dsec-s::-webkit-details-marker{display:none}
.dsec-s:hover{background:var(--n50)}
.dsec-s:focus-visible{outline:2px solid var(--g);outline-offset:-2px}
.dsec-c{width:7px;height:7px;border-right:2px solid var(--n400);border-bottom:2px solid var(--n400);
  transform:rotate(-45deg);transition:transform .18s;flex-shrink:0;margin-left:2px}
.dsec[open]>.dsec-s .dsec-c{transform:rotate(45deg)}
.dsec-h{margin-left:auto;font-size:10.5px;font-weight:500;color:var(--n400);
  text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dsec-b{padding:4px 14px 14px;border-top:1px solid var(--n100)}
@media(max-width:640px){.dsec-h{display:none}}

/* ── DARK MODE ──────────────────────────────── */
[data-theme="dark"]{
  --W:#1e293b;
  --n50:#0f172a;--n100:#1e293b;--n200:#334155;--n300:#475569;
  --n600:#cbd5e1;--n700:#e2e8f0;--n800:#f1f5f9;--n900:#f8fafc;
  --gl:rgba(0,179,134,.14);--rl:rgba(220,38,38,.14);--bl:rgba(37,99,235,.14);
  --ol:rgba(217,119,6,.14);--pl:rgba(124,58,237,.14);--tl:rgba(13,148,136,.14);
  --xs:0 1px 3px rgba(0,0,0,.35);--sm:0 2px 8px rgba(0,0,0,.45);
}
[data-theme="dark"] body{background:var(--n50);color:var(--n900)}
[data-theme="dark"] .card{box-shadow:0 1px 3px rgba(0,0,0,.35)}
[data-theme="dark"] .topbar,[data-theme="dark"] .sb{background:var(--W);border-color:var(--n100)}
[data-theme="dark"] .tw{background:var(--W);border-color:var(--n200)}
[data-theme="dark"] table thead tr{background:rgba(255,255,255,.04)}
[data-theme="dark"] table td{border-bottom-color:rgba(255,255,255,.05)}
[data-theme="dark"] table tbody tr:hover td{background:rgba(255,255,255,.03)!important}
[data-theme="dark"] .tft td{background:rgba(255,255,255,.05)!important}
[data-theme="dark"] input,[data-theme="dark"] select,[data-theme="dark"] textarea{background:var(--n50)!important;color:var(--n900)!important;border-color:var(--n200)!important}
[data-theme="dark"] .mchip{background:var(--n100);border-color:var(--n200);color:var(--n600)}
[data-theme="dark"] .mchip.on{background:var(--g);color:#fff;border-color:var(--g)}
[data-theme="dark"] .btn-s{background:var(--n100);border-color:var(--n200);color:var(--n700)}
[data-theme="dark"] .btn-s:hover{background:var(--n200)}
[data-theme="dark"] .bic{background:var(--n100);border-color:var(--n200)}
[data-theme="dark"] .bic:hover{background:var(--n200)}
[data-theme="dark"] .modal{background:var(--W)}
[data-theme="dark"] .pm-cc{background:rgba(146,64,14,.3);color:#fcd34d}
[data-theme="dark"] .pm-upi{background:rgba(6,95,70,.3);color:#6ee7b7}
[data-theme="dark"] .pm-neft{background:rgba(30,64,175,.3);color:#93c5fd}
[data-theme="dark"] .pm-cash{background:rgba(55,65,81,.4);color:#d1d5db}
[data-theme="dark"] .pm-dc{background:rgba(91,33,182,.3);color:#c4b5fd}
[data-theme="dark"] .pm-wallet{background:rgba(157,23,77,.3);color:#f9a8d4}
[data-theme="dark"] .tag.tx{background:var(--n200);color:var(--n600)}
[data-theme="dark"] .prog{background:var(--n200)}
[data-theme="dark"] .sr{border-bottom-color:var(--n200)}
[data-theme="dark"] .bulk-bar{background:rgba(0,179,134,.12);border-color:rgba(0,179,134,.25)}

.qa-btn{position:fixed;bottom:28px;right:28px;width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,var(--g),var(--gd));color:#fff;border:none;cursor:pointer;box-shadow:0 4px 16px rgba(0,179,134,.45);display:flex;align-items:center;justify-content:center;z-index:900;transition:transform .2s,box-shadow .2s;font-size:26px;line-height:1}
.qa-btn:hover{transform:scale(1.1);box-shadow:0 6px 22px rgba(0,179,134,.55)}
.qa-overlay{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:1500;backdrop-filter:blur(3px);animation:fadeIn .18s ease}
.qa-sheet{position:fixed;bottom:0;left:0;right:0;z-index:1600;background:var(--W);border-radius:22px 22px 0 0;padding:0 0 32px;box-shadow:0 -6px 28px rgba(0,0,0,.18);animation:qaUp .24s cubic-bezier(.34,1.15,.64,1)}

.ai-prompt-btn:hover{border-color:var(--p);background:var(--pl);color:var(--p);transform:translateY(-1px);box-shadow:var(--sm)}
.ai-prompt-btn.active{border-color:var(--p);background:var(--pl);color:var(--p)}
.ai-prompt-ic{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;flex-shrink:0;font-size:13px}
.ai-result{font-size:13px;line-height:1.7;color:var(--n700);white-space:pre-wrap}
.ai-result strong{color:var(--n900);font-weight:700}
.ai-section{margin-bottom:16px;padding:14px 16px;border-radius:var(--r8);border:1px solid var(--n100);background:var(--W)}
.ai-section-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--p);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.ai-chat-input{display:flex;gap:8px;padding:12px;border-top:1px solid var(--n100);background:var(--n50);border-radius:0 0 var(--r12) var(--r12)}
.ai-chat-input input{flex:1;padding:9px 13px;border:1.5px solid var(--n200);border-radius:99px;font-size:13px;font-family:var(--f);outline:none;transition:border-color .15s}
.ai-chat-input input:focus{border-color:var(--p);box-shadow:0 0 0 3px rgba(124,58,237,.1)}
.ai-msg{padding:10px 14px;border-radius:var(--r8);margin-bottom:8px;max-width:92%;animation:fadein .2s ease both}

/* ── CSV UTILITIES ─────────────────────────────────────────────
   parseCSVLine : handles quoted fields with embedded commas/quotes
   normalizeDate: accepts any common date format → YYYY-MM-DD
   flexCol      : resolve column value by multiple alias names
──────────────────────────────────────────────────────────────── */
const parseCSVLine=(line)=>{
  const res=[];let cur='';let inQ=false;
  for(let i=0;i<line.length;i++){
    const ch=line[i];
    if(ch==='"'){if(inQ&&line[i+1]==='"'){cur+='"';i++;}else inQ=!inQ;}
    else if(ch===','&&!inQ){res.push(cur.trim());cur='';}
    else cur+=ch;
  }
  res.push(cur.trim());
  return res;
};
const normalizeDate=(raw)=>{
  if(!raw)return'';
  const s=raw.trim().replace(/^["']|["']$/g,'');
  if(!s)return'';
  // Already ISO YYYY-MM-DD
  if(/^\d{4}-\d{2}-\d{2}$/.test(s))return s;
  // DD/MM/YYYY  DD-MM-YYYY  DD.MM.YYYY
  const dmy=s.match(/^(\d{1,2})[\/\-\.](\d{1,2})[\/\-\.](\d{4})$/);
  if(dmy){
    const[,d,m,y]=dmy;
    // if "month" part >12 it's actually day (some tools export M/D/Y)
    if(+m>12)return`${y}-${d.padStart(2,'0')}-${m.padStart(2,'0')}`;
    return`${y}-${m.padStart(2,'0')}-${d.padStart(2,'0')}`;
  }
  // YYYY/MM/DD  YYYY.MM.DD
  const ymd=s.match(/^(\d{4})[\/\.](\d{1,2})[\/\.](\d{1,2})$/);
  if(ymd){const[,y,m,d]=ymd;return`${y}-${m.padStart(2,'0')}-${d.padStart(2,'0')}`;}
  // DD-Mon-YYYY  DD Mon YYYY  e.g. 15-Apr-2025  15 Apr 2025
  const dMonY=s.match(/^(\d{1,2})[\s\-]([A-Za-z]{3,9})[\s\-](\d{4})$/);
  if(dMonY){
    const[,d,mon,y]=dMonY;
    const mn={'jan':1,'feb':2,'mar':3,'apr':4,'may':5,'jun':6,'jul':7,'aug':8,'sep':9,'oct':10,'nov':11,'dec':12};
    const m=mn[mon.slice(0,3).toLowerCase()];
    if(m)return`${y}-${String(m).padStart(2,'0')}-${d.padStart(2,'0')}`;
  }
  // Mon DD, YYYY  e.g. Apr 15, 2025
  const monDY=s.match(/^([A-Za-z]{3,9})\s+(\d{1,2}),?\s+(\d{4})$/);
  if(monDY){
    const[,mon,d,y]=monDY;
    const mn={'jan':1,'feb':2,'mar':3,'apr':4,'may':5,'jun':6,'jul':7,'aug':8,'sep':9,'oct':10,'nov':11,'dec':12};
    const m=mn[mon.slice(0,3).toLowerCase()];
    if(m)return`${y}-${String(m).padStart(2,'0')}-${d.padStart(2,'0')}`;
  }
  // Fallback: try native Date (handles "April 15 2025", ISO with time, etc.)
  const dt=new Date(s);
  if(!isNaN(dt.getTime()))return dt.toISOString().slice(0,10);
  return s; // return as-is; show error downstream
};
// Resolve a value from an object using multiple possible key aliases
const flexCol=(o,...keys)=>{
  for(const k of keys){const v=o[k.toLowerCase().replace(/[\s_\-]/g,'')];if(v!==undefined&&v!=='')return v;}
  return'';
};

// Generate period months dynamically from profile
function getPeriodMonths(start,end){
  const months=[];
  let [sy,sm]=start.split('-').map(Number);
  const [ey,em]=end.split('-').map(Number);
  while(sy<ey||(sy===ey&&sm<=em)){
    const key=`${sy}-${String(sm).padStart(2,'0')}`;
    const d=new Date(sy,sm-1);
    const label=d.toLocaleString('en-IN',{month:'short',year:'2-digit'}).replace(' ','-');
    months.push({key,label});
    sm++;if(sm>12){sm=1;sy++;}
  }
  return months;
}

let CUR=CURRENCIES.INR;

// Name kept as fmtINR because it is called in ~400 places; it is currency-aware now.
const fmtINR=(n,short=false)=>{
  if(n===undefined||n===null||!isFinite(n))return'–';
  const abs=Math.abs(n);const S=CUR.sym;let s;
  if(short){
    if(CUR.scale==='in'){
      if(abs>=1e7)s=`${S}${(abs/1e7).toFixed(2)}Cr`;
      else if(abs>=1e5)s=`${S}${(abs/1e5).toFixed(2)}L`;
      else if(abs>=1e3)s=`${S}${(abs/1e3).toFixed(1)}K`;
      else s=`${S}${Math.round(abs).toLocaleString(CUR.locale)}`;
    }else{
      if(abs>=1e9)s=`${S}${(abs/1e9).toFixed(2)}B`;
      else if(abs>=1e6)s=`${S}${(abs/1e6).toFixed(2)}M`;
      else if(abs>=1e3)s=`${S}${(abs/1e3).toFixed(1)}K`;
      else s=`${S}${Math.round(abs).toLocaleString(CUR.locale)}`;
    }
  // Round sub-thousand values — computed averages such as a daily burn rate
  // otherwise rendered as "₹53.571" straight out of toLocaleString.
  }else s=`${S}${Math.round(abs).toLocaleString(CUR.locale)}`;
  return n<0?`-${s}`:s;
};

/* ══════════════════════════════════════
   TOAST
══════════════════════════════════════ */
function Toast({msg,type,action,onAction,onClose}){
  // Undoable toasts linger longer — 3s is not enough to read a message and decide.
  useEffect(()=>{const t=setTimeout(onClose,action?6000:3000);return()=>clearTimeout(t);},[action]);
  return(
    <div className={`toast ${type||'x'}`} role="status">
      <Ic n="ok" s={13} c="#fff"/>{msg}
      {action&&(
        <button className="toast-act" onClick={()=>{onAction&&onAction();onClose();}}>{action}</button>
      )}
    </div>
  );
}

/* ══════════════════════════════════════
   CATEGORY INFERENCE
   Learns purely from the user's own history — "DMart" has been filed under
   "Groceries & Food" nine times, so offer that. No hardcoded merchant list.
══════════════════════════════════════ */
const inferCategory=(transactions,merchant,type)=>{
  const m=(merchant||'').trim().toLowerCase();
  if(m.length<2)return'';
  const counts={};
  for(const t of transactions){
    if(t.type!==type||!t.merchant)continue;
    const tm=t.merchant.trim().toLowerCase();
    // exact, or either side a prefix of the other, so "DMart Powai" still matches "DMart"
    if(tm!==m&&!tm.startsWith(m)&&!m.startsWith(tm))continue;
    counts[t.category]=(counts[t.category]||0)+1;
  }
  let best='',n=0;
  for(const k in counts)if(counts[k]>n){n=counts[k];best=k;}
  return best;
};
// Same idea for payment mode — most people pay a given merchant the same way.
const inferPaymentMode=(transactions,merchant,type)=>{
  const m=(merchant||'').trim().toLowerCase();
  if(m.length<2)return'';
  const counts={};
  for(const t of transactions){
    if(t.type!==type||!t.merchant||!t.paymentMode)continue;
    const tm=t.merchant.trim().toLowerCase();
    if(tm!==m&&!tm.startsWith(m)&&!m.startsWith(tm))continue;
    counts[t.paymentMode]=(counts[t.paymentMode]||0)+1;
  }
  let best='',n=0;
  for(const k in counts)if(counts[k]>n){n=counts[k];best=k;}
  return best;
};

/* ══════════════════════════════════════
   UNDOABLE DELETE
   A confirm() dialog is friction people learn to click through, and it still
   loses the data. Capturing the pre-delete state and offering it back for a few
   seconds is both faster to use and safer.
══════════════════════════════════════ */
const makeUndoDelete=(data,setData,toast)=>(msg,mutate)=>{
  const snapshot=data;                       // state as it is *before* the mutation
  setData(mutate);
  toast(msg,'x','Undo',()=>setData(snapshot));
};

        <div className="mh"><div className="mt">{title}</div><button className="bic" onClick={onClose} aria-label="Close dialog"><Ic n="x" s={13}/></button></div>
        <div className="mb">{children}</div>
        {foot&&<div className="mf">{foot}</div>}
      </div>
    </div>
  );
}

/* ══════════════════════════════════════
   DONUT RING
══════════════════════════════════════ */
function Donut({pct,color,size=86,stroke=9,label}){
  const p=Math.min(100,Math.max(0,pct||0));
  const r=(size-stroke*2)/2,c=2*Math.PI*r,off=c*(1-p/100);
  return(
    <div className="donut" style={{width:size,height:size}}>
      <svg width={size} height={size} style={{transform:'rotate(-90deg)'}}>
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="var(--n100)" strokeWidth={stroke}/>
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={color} strokeWidth={stroke} strokeDasharray={c} strokeDashoffset={off} strokeLinecap="round" style={{transition:'stroke-dashoffset .6s ease'}}/>
      </svg>
      <div className="donut-c">
        <div style={{fontFamily:'var(--m)',fontSize:13,fontWeight:800,color,lineHeight:1}}>{p.toFixed(1)}%</div>
        {label&&<div style={{fontSize:8,color:'var(--n400)',textTransform:'uppercase',letterSpacing:.5,marginTop:1}}>{label}</div>}
      </div>
    </div>
  );
}

/* ══════════════════════════════════════
   BAR CHART
══════════════════════════════════════ */
function BarChart({months,incomes,expenses,height=90}){
  const max=Math.max(...incomes,...expenses,1);
  const [hov,setHov]=useState(null);
  return(
    <div>
      {hov!==null&&<div style={{textAlign:'center',fontSize:11,color:'var(--n500)',marginBottom:4,height:16}}>
        <span style={{color:'var(--gd)',fontWeight:600}}>{fmtINR(incomes[hov],true)}</span>
        <span style={{color:'var(--n400)',margin:'0 6px'}}>vs</span>
        <span style={{color:'var(--r)',fontWeight:600}}>{fmtINR(expenses[hov],true)}</span>
        <span style={{color:'var(--n400)',marginLeft:6}}>{months[hov]?.label}</span>
      </div>}
      {hov===null&&<div style={{height:16}}/>}
      <div className="barchart" style={{height}}>
        {months.map((m,i)=>{
          const ip=(incomes[i]||0)/max*(height-22),ep=(expenses[i]||0)/max*(height-22);
          return(
            <div key={m.key} className="barcol" onMouseEnter={()=>setHov(i)} onMouseLeave={()=>setHov(null)}>
              <div className="barpair" style={{height:height-22}}>
                <div className="bar" style={{height:Math.max(2,ip),background:hov===i?'var(--g)':'rgba(0,179,134,.55)',alignSelf:'flex-end'}}/>
                <div className="bar" style={{height:Math.max(2,ep),background:hov===i?'#ef4444':'rgba(239,68,68,.45)',alignSelf:'flex-end'}}/>
              </div>
              <div className="bar-lbl">{m.label}</div>
            </div>
          );
        })}

    </div>
  );
}

  const efAccs=accounts.filter(a=>ef.accountIds.includes(a.id));
  const efBalance=efAccs.reduce((s,a)=>s+a.balance,0);
  // Emergency Fund target = Total monthly budget of ★ Major categories × target months
  const majorCats=data.majorExpenseCategories||[];
  const majorMonthlyBudget=majorCats.reduce((s,c)=>(data.budgetLimits[c]||0)+s,0);
  const avgMonthlyExp=majorMonthlyBudget>0?majorMonthlyBudget:(fallbackExp||0);
  const target=avgMonthlyExp*(ef.targetMonths||6);
  const efPct=target>0?Math.min(100,efBalance/target*100):0;
  const monthsCovered=avgMonthlyExp>0?efBalance/avgMonthlyExp:0;
  const progressColor=efPct>=100?'#6ee7b7':efPct>=50?'#fcd34d':'#fca5a5';
  const statusBg=efPct>=100?'rgba(0,179,134,.3)':efPct>=50?'rgba(217,119,6,.3)':'rgba(220,38,38,.3)';

  // Never call an unconfigured fund "Underfunded" — that reads as a failing grade

  const notSetUp=efAccs.length===0;
  if(notSetUp)return(

          Choose which of your accounts hold emergency savings and MyeeCFO will track how many
          months of expenses they cover.
        </div>
        <button className="btn btn-sm" onClick={()=>setPage&&setPage('master')}
          aria-label="Set up emergency fund in Master Settings"
          style={{background:'rgba(255,255,255,.16)',color:'#fff',border:'1px solid rgba(255,255,255,.28)'}}>
          Link accounts →
        </button>
      </div>
    </div>
  );

  const efStatus=efPct>=100?'Fully Funded':efPct>=50?'Partially Funded':'Underfunded';
  return(
    <div className="ef-card">
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',position:'relative',zIndex:1}}>
        <div>
          <div style={{fontSize:10,opacity:.6,textTransform:'uppercase',letterSpacing:.7,marginBottom:3}}>Emergency Fund</div>
          <div style={{fontFamily:'var(--m)',fontSize:24,fontWeight:800}}>{fmtINR(efBalance)}</div>
          <div style={{fontSize:11,opacity:.6,marginTop:3,fontFamily:'var(--m)'}}>{fmtINR(efBalance,true)} · {monthsCovered.toFixed(1)} months covered</div>
        </div>
        <div style={{textAlign:'right'}}>
          <div style={{fontSize:10,opacity:.6,textTransform:'uppercase',letterSpacing:.5,marginBottom:4}}>Status</div>
          <span style={{background:statusBg,color:progressColor,padding:'4px 10px',borderRadius:'99px',fontSize:11,fontWeight:700}}>{efStatus}</span>
          <div style={{fontSize:10,opacity:.5,marginTop:4}}>Target: {ef.targetMonths||6} months</div>
        </div>
      </div>
      <div style={{marginTop:8,position:'relative',zIndex:1,fontSize:10,opacity:.6}}>
        {majorCats.length>0
          ?`Based on \u2605 Major categories budget: ${fmtINR(majorMonthlyBudget,true)}/mo (${majorCats.join(', ')})`
          :'No \u2605 Major categories set. Using avg monthly expense as fallback. Mark categories as Major in Master Settings.'}
      </div>
      <div style={{marginTop:8,position:'relative',zIndex:1}}>
        <div style={{height:6,background:'rgba(255,255,255,.15)',borderRadius:99,overflow:'hidden'}}>
          <div style={{height:'100%',width:`${efPct}%`,background:progressColor,borderRadius:99,transition:'width .5s'}}/>
        </div>
        <div style={{display:'flex',justifyContent:'space-between',marginTop:5}}>
          <span style={{fontSize:10,opacity:.5}}>{efPct.toFixed(0)}% of target</span>
          <span style={{fontSize:10,opacity:.5}}>Target: {fmtINR(target,true)}</span>
        </div>
      </div>
    </div>
  );
}

/* ══════════════════════════════════════
   FINANCIAL ENGINE — single source of truth
   Every page derives its numbers from here so that
   "Net Worth" means exactly one thing app-wide.
══════════════════════════════════════ */
const monthKey=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;

function computeFin(data,months){
  const {transactions=[],accounts=[],creditCards=[],loans=[],budgetLimits={},expenseCategories=[]}=data;

  // ── Balance sheet ──
  const bankBal=accounts.filter(a=>a.type==='bank').reduce((s,a)=>s+a.balance,0);
  const cashBal=accounts.filter(a=>a.type==='cash'||a.type==='wallet').reduce((s,a)=>s+a.balance,0);
  const fdBal=accounts.filter(a=>a.type==='fd').reduce((s,a)=>s+a.balance,0);
  const liquid=bankBal+cashBal;
  const assets=liquid+fdBal;
  const ccPay=creditCards.reduce((s,c)=>s+c.payable,0);
  const ccProv=creditCards.reduce((s,c)=>s+c.provision,0);
  const ccLiab=ccPay+ccProv;
  const totalLimit=creditCards.reduce((s,c)=>s+c.limit,0);
  const ccUtil=totalLimit>0?ccLiab/totalLimit*100:0;
  const loanOS=loans.reduce((s,l)=>s+l.outstanding,0);
  const provTotal=(data.provisions||[]).filter(p=>!p.paid).reduce((s,p)=>s+p.amount,0);
  const liabilities=ccLiab+loanOS+provTotal;
  // THE canonical figure. Assets − all liabilities. Used everywhere.
  const netWorth=assets-liabilities;

  // ── Period flows (single pass; months lookup is a Set) ──
  const mSet=new Set(months.map(m=>m.key));
  const periodTxs=transactions.filter(t=>mSet.has(t.month));
  let totalInc=0,totalExp=0;
  const incByMonth={},expByMonth={},catMap={},merchantMap={},merchantCnt={},pmMap={};
  for(const t of periodTxs){
    if(t.type==='income'){totalInc+=t.amount;incByMonth[t.month]=(incByMonth[t.month]||0)+t.amount;}
    else if(t.type==='expense'){
      totalExp+=t.amount;expByMonth[t.month]=(expByMonth[t.month]||0)+t.amount;
      catMap[t.category]=(catMap[t.category]||0)+t.amount;
      if(t.merchant){merchantMap[t.merchant]=(merchantMap[t.merchant]||0)+t.amount;merchantCnt[t.merchant]=(merchantCnt[t.merchant]||0)+1;}
      const pm=t.paymentMode||'Unknown';pmMap[pm]=(pmMap[pm]||0)+t.amount;
    }
  }
  const surplus=totalInc-totalExp;
  const savingsRate=totalInc>0?surplus/totalInc*100:0;
  const mInc=months.map(m=>incByMonth[m.key]||0);
  const mExp=months.map(m=>expByMonth[m.key]||0);

  // ── Elapsed basis ── how much of the period has actually happened.
  // Everything time-normalised (budgets, averages) MUST use this, never months.length,
  // otherwise part-year spend gets compared against a full-year allowance.
  const nowKey=monthKey(new Date());
  const elapsedMonths=Math.min(months.length,Math.max(1,months.filter(m=>m.key<=nowKey).length));
  const startDate=months.length?new Date(months[0].key+'-01'):new Date();
  const [ey,em]=(months.length?months[months.length-1].key:nowKey).split('-').map(Number);
  const endDate=new Date(ey,em,0); // last day of final month
  const effectiveDate=new Date(Math.min(Date.now(),endDate.getTime()));
  const daysElapsed=Math.max(1,Math.round((effectiveDate-startDate)/86400000));
  const avgDailyBurn=totalExp/daysElapsed;
  const avgMonthlyInc=totalInc/daysElapsed*30;
  const avgMonthlyExp=totalExp/daysElapsed*30;
  const cashSurplus=avgMonthlyInc-avgMonthlyExp;

  // ── Budget, pro-rated to elapsed months ──
  const budgetMonthly=expenseCategories.reduce((s,c)=>s+(budgetLimits[c]||0),0);
  const budgetToDate=budgetMonthly*elapsedMonths;   // fair comparison vs totalExp
  const budgetFullPeriod=budgetMonthly*months.length; // informational only
  const budgetPct=budgetToDate>0?totalExp/budgetToDate*100:0;

  // ── Liability tenure classification (the 12-month rule) ──
  // A liability is SHORT TERM if it falls due within the next 12 months.
  //  · Credit cards  — always short term by nature
  //  · Overdraft     — a bank account with a negative balance; already inside `liquid`
  //  · Loans         — short term only when they finish inside the window
  //  · Expected future outflows — short term when their expected month is inside it
  const horizon=new Date();horizon.setMonth(horizon.getMonth()+12);
  const horizonKey=`${horizon.getFullYear()}-${String(horizon.getMonth()+1).padStart(2,'0')}`;
  const isShortTermLoan=l=>{
    if(!l.endDate)return false;                    // open-ended → treat as long term
    const end=new Date(l.endDate);
    return isFinite(end)&&end<=horizon;
  };
  const shortTermLoans=loans.filter(isShortTermLoan);
  const longTermLoans=loans.filter(l=>!isShortTermLoan(l));
  const shortTermLoanOS=shortTermLoans.reduce((s,l)=>s+(l.outstanding||0),0);
  const longTermLoanOS=longTermLoans.reduce((s,l)=>s+(l.outstanding||0),0);
  // Overdrafts, broken out for display only — they already reduce `bankBal`.
  const odBal=Math.abs(accounts.filter(a=>a.type==='bank'&&a.balance<0).reduce((s,a)=>s+a.balance,0));
  // Expected future outflows landing inside the window
  const provShortTerm=(data.provisions||[]).filter(p=>!p.paid&&(p.month||'')<=horizonKey).reduce((s,p)=>s+p.amount,0);
  const shortTermLiab=ccLiab+shortTermLoanOS+provShortTerm;
  // THE figure: what your funds cover once only near-term obligations are netted off.
  // Long-term loan principal is deliberately excluded — it is not due yet.
  const fundBalExclLTL=assets-shortTermLiab;
  // For context: the slice of long-term debt that *is* payable in the next 12 months.
  const ltCurrentPortion=longTermLoans.reduce((s,l)=>s+Math.min((l.emi||0)*12,l.outstanding||0),0);

  // ── Loans ──
  const totalEmi=loans.reduce((s,l)=>s+(l.emi||0),0);
  const monthlyInterestCost=loans.reduce((s,l)=>s+(l.outstanding||0)*((l.roi||0)/100/12),0);
  const monthlyPrincipalRepaid=Math.max(0,totalEmi-monthlyInterestCost);
  const monthlyNWGrowth=cashSurplus+monthlyPrincipalRepaid;
  const emiRatio=avgMonthlyInc>0?totalEmi/avgMonthlyInc*100:0;

  // ── Runway ──
  const burnRate=avgDailyBurn*30;
  const liquidRunway=burnRate>0?liquid/burnRate:99;
  const fundRunway=burnRate>0?assets/burnRate:99;

  // ── Month-over-month deltas (last two COMPLETE months) ──
  const completed=months.filter(m=>m.key<nowKey);
  const lastM=completed[completed.length-1],prevM=completed[completed.length-2];
  const mom=(map)=>{
    if(!lastM||!prevM)return null;
    const cur=map[lastM.key]||0,prv=map[prevM.key]||0;
    if(prv===0)return null;
    return{pct:(cur-prv)/Math.abs(prv)*100,cur,prv,label:lastM.label};
  };
  const momInc=mom(incByMonth),momExp=mom(expByMonth);

  return{
    bankBal,cashBal,fdBal,liquid,assets,ccPay,ccProv,ccLiab,totalLimit,ccUtil,
    loanOS,provTotal,liabilities,netWorth,
    shortTermLoans,longTermLoans,shortTermLoanOS,longTermLoanOS,odBal,
    provShortTerm,shortTermLiab,fundBalExclLTL,ltCurrentPortion,
    periodTxs,totalInc,totalExp,surplus,savingsRate,mInc,mExp,
    catMap,merchantMap,merchantCnt,pmMap,
    elapsedMonths,daysElapsed,avgDailyBurn,burnRate,avgMonthlyInc,avgMonthlyExp,cashSurplus,
    budgetMonthly,budgetToDate,budgetFullPeriod,budgetPct,
    totalEmi,monthlyInterestCost,monthlyPrincipalRepaid,monthlyNWGrowth,emiRatio,
    liquidRunway,fundRunway,momInc,momExp,
  };
}
// Memoised so a keystroke elsewhere doesn't re-run every reduce on the dashboard.
const useFin=(data,months)=>useMemo(()=>computeFin(data,months),[data,months]);

/* ══════════════════════════════════════
   ACTION ENGINE — turns state into a short to-do list
   Replaces five scattered "status" cards with one ranked list.
══════════════════════════════════════ */
function buildActions(data,fin,months){
  const out=[];
  const push=(sev,title,detail,cta,page)=>out.push({sev,title,detail,cta,page});

  // 1. Credit card dues — soonest first, only what's actually actionable
  (data.creditCards||[]).filter(c=>c.dueDate&&c.payable>0).forEach(c=>{
    const d=daysDiff(c.dueDate);
    if(d===null||d>14)return;
    if(d<0)push(0,`${c.bank} card is ${Math.abs(d)} days overdue`,`${fmtINR(c.payable)} outstanding — pay now to stop interest accruing.`,'Open Credit Cards','cc');
    else push(d<=3?0:1,`${c.bank} card due ${d===0?'today':`in ${d} day${d===1?'s':''}`}`,`${fmtINR(c.payable)} due on ${fmtDate(c.dueDate)}.`,'Open Credit Cards','cc');
  });

  // 2. Categories over their pro-rated budget
  (data.expenseCategories||[]).forEach(cat=>{
    const lim=data.budgetLimits[cat];if(!lim)return;
    const allowed=lim*fin.elapsedMonths;if(allowed<=0)return;
    const spent=(fin.catMap[cat]||0);
    const pct=spent/allowed*100;
    if(pct>=100)push(1,`${cat} is over budget`,`${fmtINR(spent,true)} spent vs ${fmtINR(allowed,true)} allowed so far (${pct.toFixed(0)}%).`,'Review Budget','budget');
    else if(pct>=85)push(2,`${cat} is at ${pct.toFixed(0)}% of budget`,`${fmtINR(allowed-spent,true)} left for this period.`,'Review Budget','budget');
  });

  // 3. Emergency fund — distinguish "not set up" from "underfunded"
  const ef=data.emergencyFund||{accountIds:[],targetMonths:6};
  if(!ef.accountIds||ef.accountIds.length===0){
    push(2,'Emergency fund not set up','Link the accounts that hold your emergency savings so cover can be tracked.','Set it up','master');
  }else{
    const efBal=(data.accounts||[]).filter(a=>ef.accountIds.includes(a.id)).reduce((s,a)=>s+a.balance,0);
    const need=fin.avgMonthlyExp>0?fin.avgMonthlyExp:0;
    const covered=need>0?efBal/need:0;
    if(need>0&&covered<3)push(1,`Emergency fund covers only ${covered.toFixed(1)} months`,`Aim for ${ef.targetMonths||6} months (${fmtINR(need*(ef.targetMonths||6),true)}).`,'View accounts','fund');
  }

  // 4. Spending outpacing income
  if(fin.surplus<0)push(0,'You are spending more than you earn',`${fmtINR(Math.abs(fin.surplus),true)} deficit this period.`,'See breakdown','reports');
  else if(fin.savingsRate<10&&fin.totalInc>0)push(2,`Savings rate is ${fin.savingsRate.toFixed(0)}%`,'Below the 20% guideline — see which categories to trim.','See breakdown','reports');

  // 5. Debt burden
  if(fin.emiRatio>35)push(1,`EMIs are ${fin.emiRatio.toFixed(0)}% of income`,'Above the 35% comfort threshold. Consider prepaying the costliest loan.','Open Debt Optimizer','debt');

  // 6. High credit utilisation
  if(fin.ccUtil>30)push(1,`Credit utilisation is ${fin.ccUtil.toFixed(0)}%`,'Keeping this under 30% protects your credit score.','Open Credit Cards','cc');

  // 7. Recurring transactions waiting
  const dueRec=(data.recurring||[]).filter(r=>r.active&&r.nextDate&&r.nextDate<=new Date().toISOString().slice(0,10)).length;
  if(dueRec>0)push(2,`${dueRec} recurring transaction${dueRec>1?'s':''} due`,'These post automatically — review them if anything looks off.','Open Recurring','recurring');

  // 8. Empty state — a genuinely new user should see a start, not alarms
  if((data.transactions||[]).length===0)push(2,'No transactions yet','Add your first income or expense to unlock every metric here.','Add transaction','expense');

  return out.sort((a,b)=>a.sev-b.sev);
}

/* ══════════════════════════════════════

function PageDashboard({data,setPage}){
  const {creditCards,loans,profile}=data;
  const months=useMemo(()=>getPeriodMonths(profile.periodStart,profile.periodEnd),[profile.periodStart,profile.periodEnd]);
  const f=useFin(data,months);
  const actions=useMemo(()=>buildActions(data,f,months),[data,f,months]);
  const [showAll,setShowAll]=useState(false);

  // Tier-2 detail derived values
  const topMerchants=useMemo(()=>Object.entries(f.merchantMap).sort((a,b)=>b[1]-a[1]).slice(0,5),[f.merchantMap]);
  const doughnut=useMemo(()=>{
    const all=Object.entries(f.catMap).sort((a,b)=>b[1]-a[1]);
    const top=all.slice(0,8);
    const others=all.slice(8).reduce((s,[,v])=>s+v,0);
    if(others>0)top.push(['Others',others]);
    return{cats:top,labels:top.map(([c])=>c),values:top.map(([,v])=>v),colors:top.map((_,i)=>CHART_COLORS[i%CHART_COLORS.length])};
  },[f.catMap]);
  const dues=useMemo(()=>creditCards.filter(c=>c.dueDate&&c.payable>0).sort((a,b)=>new Date(a.dueDate)-new Date(b.dueDate)),[creditCards]);

  const sevStyle=s=>s===0
    ?{bg:'var(--rl)',border:'rgba(220,38,38,.3)',dot:'var(--r)',label:'Act now'}
    :s===1?{bg:'var(--ol)',border:'rgba(217,119,6,.28)',dot:'var(--o)',label:'Watch'}
    :{bg:'var(--bl)',border:'rgba(37,99,235,.22)',dot:'var(--b)',label:'Consider'};

  const Delta=({m,invert})=>{
    if(!m)return null;
    const up=m.pct>=0;
    const good=invert?!up:up; // for expenses, up is bad
    return(
      <span title={`${m.label} vs previous month`} style={{fontSize:9.5,fontWeight:700,color:good?'var(--gd)':'var(--r)',display:'inline-flex',alignItems:'center',gap:2}}>
        {up?'▲':'▼'}{Math.abs(m.pct).toFixed(0)}% MoM
      </span>
    );
  };

  return(
    <div className="page">
      {/* ══ TIER 1 · HERO — headline first, then the arithmetic that produced it ══ */}
      <div className="hero mb3">
        <div style={{position:'relative',zIndex:1}}>
          <div className="hero-label">Liquid Net Worth</div>
          <div className="hero-amount" style={{color:f.netWorth>=0?'#6ee7b7':'#fca5a5'}}>{fmtINR(f.netWorth)}</div>
          <div style={{fontSize:11,opacity:.55,marginTop:4,fontFamily:'var(--m)'}}>{fmtINR(f.netWorth,true)} · {periodLabel(profile.periodStart,profile.periodEnd)}</div>
        </div>
        {/* Breakup reads left-to-right as a sum, so the headline is self-explaining */}
        <div className="hero-calc">
          {[
            {l:'Bank',v:f.bankBal,c:'#93c5fd',op:null},
            {l:'Cash & Wallet',v:f.cashBal,c:'#86efac',op:'+'},
            {l:'Fixed Deposit',v:f.fdBal,c:'#fcd34d',op:'+'},
            {l:'Credit Cards',v:f.ccLiab,c:f.ccLiab>0?'#fca5a5':'#6ee7b7',op:'−'},
            {l:'Loans',v:f.loanOS,c:f.loanOS>0?'#fca5a5':'#6ee7b7',op:'−'},
            {l:'Future Outflows',v:f.provTotal,c:f.provTotal>0?'#fdba74':'#6ee7b7',op:'−'},
          ].map(a=>(
            <React.Fragment key={a.l}>
              {a.op&&<span className="hero-op" aria-hidden="true">{a.op}</span>}
              <div className="hero-term">
                <div className="hero-term-l">{a.l}</div>
                <div className="hero-term-v" style={{color:a.c}}>{fmtINR(a.v,true)}</div>
              </div>
            </React.Fragment>
          ))}
          <span className="hero-op" aria-hidden="true">=</span>
          <div className="hero-term">
            <div className="hero-term-l">Liquid Net Worth</div>
            <div className="hero-term-v" style={{color:f.netWorth>=0?'#6ee7b7':'#fca5a5',fontWeight:800}}>{fmtINR(f.netWorth,true)}</div>
          </div>
        </div>
      </div>

      {/* ══ TIER 1 · Short-term liquidity — net worth's near-term sibling ══ */}
      <div className="card mb3 stl-card">
        <div className="sh mb2">
          <div className="sh-t"><Ic n="bank" s={14} c="var(--b)"/>Fund Balance (Excl. Long-Term Loans)</div>
          <span className="tag tx" style={{fontSize:10}}>Liabilities due within 12 months</span>
        </div>
        <div className="stl-row">
          <div className="stl-main">
            <div className="stl-val" style={{color:f.fundBalExclLTL>=0?'var(--pos)':'var(--neg)'}}>{fmtINR(f.fundBalExclLTL)}</div>
            <div className="stl-sub">
              What your funds cover once only near-term obligations are settled.
              {f.longTermLoanOS>0&&<> Long-term loan principal of <strong>{fmtINR(f.longTermLoanOS,true)}</strong> is excluded — it is not due yet.</>}
            </div>
          </div>
          <div className="stl-calc">
            {[
              {l:'Bank + Cash',v:f.liquid,op:null,c:'var(--n800)',
                note:f.odBal>0?`incl. OD −${fmtINR(f.odBal,true)}`:''},
              {l:'Fixed Deposit',v:f.fdBal,op:'+',c:'var(--n800)'},
              {l:'Credit Cards',v:f.ccLiab,op:'−',c:'var(--neg)',note:'always short term'},
              {l:'Loans < 12 mo',v:f.shortTermLoanOS,op:'−',c:'var(--neg)',
                note:f.shortTermLoans.length?`${f.shortTermLoans.length} loan${f.shortTermLoans.length>1?'s':''}`:'none'},
              {l:'Outflows < 12 mo',v:f.provShortTerm,op:'−',c:'var(--warn)'},
            ].map(x=>(
              <React.Fragment key={x.l}>
                {x.op&&<span className="stl-op" aria-hidden="true">{x.op}</span>}
                <div className="stl-term">
                  <div className="stl-term-l">{x.l}</div>
                  <div className="stl-term-v" style={{color:x.c}}>{fmtINR(x.v,true)}</div>
                  {x.note&&<div className="stl-term-n">{x.note}</div>}
                </div>
              </React.Fragment>
            ))}
          </div>
        </div>
        {(f.longTermLoanOS>0||f.ltCurrentPortion>0)&&(
          <div className="stl-foot">
            <span><strong>{f.longTermLoans.length}</strong> long-term loan{f.longTermLoans.length===1?'':'s'} excluded · {fmtINR(f.longTermLoanOS,true)} outstanding</span>
            <span>Of that, <strong>{fmtINR(f.ltCurrentPortion,true)}</strong> falls due as EMIs over the next 12 months</span>
          </div>
        )}
      </div>

      {/* ══ TIER 1 · KPIs with month-over-month movement ══ */}
      <div className="g4 mb3">
        {[
          {l:'Period Income',v:f.totalInc,col:'g',icon:'inc',bg:'var(--gl)',
            trend:`Avg ${fmtINR(Math.round(f.avgMonthlyInc),true)}/mo`,delta:<Delta m={f.momInc}/>},
          {l:'Period Expense',v:f.totalExp,col:'r',icon:'exp',bg:'var(--rl)',
            trend:`Avg ${fmtINR(Math.round(f.avgMonthlyExp),true)}/mo`,delta:<Delta m={f.momExp} invert/>},
          {l:'Net Surplus',v:f.surplus,col:f.surplus>=0?'g':'r',icon:'pnl',bg:f.surplus>=0?'var(--gl)':'var(--rl)',
            trend:`${f.savingsRate.toFixed(1)}% saved`},
          {l:'Budget Used',v:null,pct:f.budgetPct,col:f.budgetPct>100?'r':f.budgetPct>85?'o':'b',icon:'budget',
            bg:f.budgetPct>100?'var(--rl)':f.budgetPct>85?'var(--ol)':'var(--bl)',
            trend:`${fmtINR(f.totalExp,true)} of ${fmtINR(f.budgetToDate,true)}`},
        ].map((k,i)=>(
          <div key={k.l} className={`kpi-card ${k.col}`} style={{animationDelay:`${i*0.05}s`}}>
            <div className="kpi-ic-wrap">
              <div className="kpi-ic" style={{background:k.bg}}><Ic n={k.icon} c={k.col==='g'?'var(--g)':k.col==='r'?'var(--r)':k.col==='b'?'var(--b)':'var(--o)'}/></div>
              {k.delta}
            </div>
            <div className="cl">{k.l}</div>
            <div className={`cv ${k.col}`} style={{fontSize:18}}>
              {k.pct!==undefined?`${k.pct.toFixed(0)}%`:fmtINR(k.v,true)}
            </div>
            <div className="cm" style={{fontSize:10}}>{k.trend}</div>
          </div>
        ))}
      </div>
      {f.budgetMonthly>0&&(
        <div style={{fontSize:10.5,color:'var(--n400)',marginTop:-8,marginBottom:14}}>
          Budget is pro-rated to <strong style={{color:'var(--n600)'}}>{f.elapsedMonths} of {months.length} months</strong> elapsed
          ({fmtINR(f.budgetMonthly,true)}/mo × {f.elapsedMonths}), so spend is compared like-for-like.
        </div>
      )}

      {/* ══ TIER 1 · WHAT NEEDS YOUR ATTENTION ══ */}
      <div className="card mb3">
        <div className="sh mb2">
          <div className="sh-t"><Ic n="bell" s={14} c={actions.length?'var(--o)':'var(--g)'}/>What needs your attention</div>
          {actions.length>3&&(
            <button className="btn btn-s btn-sm" style={{fontSize:11}} onClick={()=>setShowAll(v=>!v)}>
              {showAll?'Show top 3':`Show all ${actions.length}`}
            </button>
          )}
        </div>
        {actions.length===0?(
          <div style={{textAlign:'center',padding:'22px 0',color:'var(--n400)',fontSize:13}}>
            <div style={{fontSize:26,marginBottom:6}}>✓</div>
            Nothing needs action. Dues are clear, budgets are on track.
          </div>
        ):(
          <div style={{display:'flex',flexDirection:'column',gap:8}}>
            {(showAll?actions:actions.slice(0,3)).map((a,i)=>{
              const st=sevStyle(a.sev);
              return(
                <div key={i} style={{display:'flex',gap:12,alignItems:'flex-start',padding:'11px 13px',borderRadius:10,background:st.bg,border:`1.5px solid ${st.border}`}}>
                  <span style={{width:9,height:9,borderRadius:'50%',background:st.dot,flexShrink:0,marginTop:5}}/>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontSize:13,fontWeight:700,color:'var(--n800)',marginBottom:2}}>{a.title}</div>
                    <div style={{fontSize:11.5,color:'var(--n500)',lineHeight:1.45}}>{a.detail}</div>
                  </div>
                  <button className="btn btn-s btn-sm" style={{fontSize:10.5,flexShrink:0,whiteSpace:'nowrap'}}
                    onClick={()=>setPage(a.page)} aria-label={`${a.cta} — ${a.title}`}>{a.cta} →</button>
                </div>
              );
            })}
          </div>
        )}
      </div>

      {/* ══ TIER 2 · Everything below is collapsed by default ══ */}
      <details className="dsec">
        <summary className="dsec-s"><span className="dsec-c"/>Trends &amp; cash flow<span className="dsec-h">Monthly chart · credit utilisation · budget status</span></summary>
        <div className="dsec-b">
          <div className="row mb3">
            <div className="card col">
              <div className="sh mb2">
                <div className="sh-t"><Ic n="pnl" s={14} c="var(--g)"/>Monthly Income · Expense · Savings</div>
                <span className="tag tx" style={{fontSize:10}}>{months.length} months</span>
              </div>
              <CJSBar months={months} incomes={f.mInc} expenses={f.mExp} height={220}/>
            </div>
            <div style={{width:260,flexShrink:0,display:'flex',flexDirection:'column',gap:10}}>
              <div className="card" style={{flex:1}}>
                <div className="sh mb2"><div className="sh-t"><Ic n="cc" s={13} c="var(--g)"/>CC Utilization</div></div>
                <div style={{display:'flex',alignItems:'center',gap:12}}>
                  <Donut pct={f.ccUtil} color={f.ccUtil>30?'var(--r)':f.ccUtil>15?'var(--o)':'var(--g)'} size={76} stroke={7} label="Used"/>
                  <div style={{flex:1}}>
                    <div className="sr"><span className="sr-l">Billed</span><span className="sr-v neg">{fmtINR(f.ccPay,true)}</span></div>
                    <div className="sr"><span className="sr-l">Unbilled</span><span className="sr-v" style={{color:'var(--o)'}}>{fmtINR(f.ccProv,true)}</span></div>
                    <div className="sr"><span className="sr-l">Limit</span><span className="sr-v">{fmtINR(f.totalLimit,true)}</span></div>
                  </div>
                </div>
              </div>
              <div className="card" style={{flex:1}}>
                <div className="sh mb2"><div className="sh-t"><Ic n="budget" s={13} c="var(--g)"/>Budget Status</div></div>
                <div style={{marginBottom:8}}>
                  <div className="prog"><div className="pf" style={{width:`${Math.min(100,f.budgetPct)}%`,background:f.budgetPct>100?'var(--r)':f.budgetPct>85?'var(--o)':'var(--g)'}}/></div>
                </div>
                <div className="sr"><span className="sr-l">Spent</span><span className="sr-v neg">{fmtINR(f.totalExp,true)}</span></div>
                <div className="sr"><span className="sr-l">Allowed to date</span><span className="sr-v">{fmtINR(f.budgetToDate,true)}</span></div>
                <div className="sr"><span className="sr-l">{f.budgetToDate-f.totalExp>=0?'Remaining':'Overspent'}</span><span className={`sr-v ${f.budgetToDate-f.totalExp>=0?'pos':'neg'}`}>{fmtINR(Math.abs(f.budgetToDate-f.totalExp),true)}</span></div>
              </div>
            </div>
          </div>
        </div>
      </details>

      <details className="dsec">
        <summary className="dsec-s"><span className="dsec-c"/>Where the money went<span className="dsec-h">Categories · merchants · payment modes</span></summary>
        <div className="dsec-b">
          <div className="g2 mb3">
            <div className="card">
              <div className="sh mb2">
                <div className="sh-t"><Ic n="exp" s={14} c="var(--g)"/>Expense by Category</div>
                <span className="tag tx" style={{fontSize:10}}>{periodLabel(profile.periodStart,profile.periodEnd)}</span>
              </div>
              {doughnut.values.length===0
                ?<div style={{fontSize:12,color:'var(--n400)',padding:'20px 0',textAlign:'center'}}>No expenses recorded yet.</div>
                :<div style={{display:'flex',gap:14,alignItems:'flex-start'}}>
                  <div style={{width:170,flexShrink:0}}>
                    <CJSDoughnut labels={doughnut.labels} values={doughnut.values} colors={doughnut.colors} height={170} title="Expenses"/>
                  </div>
                  <div style={{flex:1,overflowY:'auto',maxHeight:185}}>
                    {doughnut.cats.map(([cat,amt],i)=>{
                      const pct=f.totalExp>0?amt/f.totalExp*100:0;
                      return(
                        <div key={cat} style={{display:'flex',alignItems:'center',gap:7,marginBottom:7}}>
                          <span style={{width:8,height:8,borderRadius:2,background:doughnut.colors[i],flexShrink:0,display:'inline-block'}}/>
                          <span style={{flex:1,fontSize:11.5,color:'var(--n700)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{cat}</span>

                    <div className="prog"><div className="pf" style={{width:`${pct}%`,background:colors[i]}}/></div>

          </div>

      </details>

      <details className="dsec">
        <summary className="dsec-s"><span className="dsec-c"/>Safety net &amp; goals<span className="dsec-h">Emergency fund · savings goals</span></summary>
        <div className="dsec-b">
          <div className="g2">
            <EfCard data={data} accounts={data.accounts} avgMonthlyExp={f.avgMonthlyExp} setPage={setPage}/>
            <div className="card">
              <div className="sh mb2">
                <div className="sh-t"><Ic n="budget" s={14} c="var(--g)"/>Savings Goals</div>
                <button className="btn btn-g btn-sm" onClick={()=>setPage('goals')} style={{marginLeft:'auto',fontSize:11}} aria-label="View all savings goals">View All →</button>
              </div>
              {(data.goals||[]).length===0
                ?<div style={{fontSize:12,color:'var(--n400)',padding:'8px 0'}}>No goals set — go to Savings Goals to create your first target.</div>

                  const monthsLeft=g.targetDate?Math.max(1,(new Date(g.targetDate)-new Date())/86400000/30):1;

                  return(
                    <div key={g.id} style={{marginBottom:14}}>

                      <div className="prog" style={{height:6,marginBottom:4}}><div className="pf" style={{width:`${pct}%`,background:g.color||'var(--g)'}}/></div>
                      <div style={{display:'flex',justifyContent:'space-between',fontSize:10.5,color:'var(--n400)'}}>
                        <span>{fmtINR(g.currentAmount,true)} of {fmtINR(g.targetAmount,true)}</span>
                        {g.targetDate&&<span style={{color:'var(--o)',fontWeight:600}}>{CUR.sym}{Math.round(needed).toLocaleString(CUR.locale)}/mo needed</span>}
                      </div>

        <div className="dsec-b">

                <button className="btn btn-s btn-sm" onClick={()=>setPage('cc')} style={{fontSize:11}} aria-label="View all credit cards">View All</button>

                    const urgent=d!==null&&d<=3,warn=d!==null&&d<=7;

                            <div className="due-bank">{cc.bank}</div>

/* ══════════════════════════════════════

function PageFund({data,setData,toast}){
  const {accounts,budgetLimits,transactions,profile}=data;
  const [modal,setModal]=useState(null);
  const ef={name:'',type:'bank',accNo:'XXXX-0000',balance:'',color:'#1a4a6e'};
  const [form,setForm]=useState(ef);
  const fundFileRef=useRef();
  const handleFundCSV=e=>{
    const f=e.target.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=ev=>{
      const raw=ev.target.result.replace(/\r/g,'');
      const lines=raw.split('\n').filter(l=>l.trim());
      if(lines.length<2){toast('CSV empty','r');return;}
      const hdr=parseCSVLine(lines[0]).map(h=>h.replace(/"/g,'').trim().toLowerCase().replace(/[\s_\-]/g,''));
      const ca=(...aliases)=>(cols)=>{for(const a of aliases){const i=hdr.indexOf(a.toLowerCase().replace(/[\s_\-]/g,''));if(i>=0&&cols[i])return cols[i];}return'';};
      const getName=ca('name','accountname','bankname','account');
      const getType=ca('type','accounttype','category');
      const getAccNo=ca('accno','accountnumber','acno','number','accountno');
      const getBal=ca('balance','amount','bal','openingbalance');
      const getColor=ca('color','colour');
      const accs=lines.slice(1).map(line=>{
        if(!line.trim())return null;
        const cols=parseCSVLine(line);
        const name=getName(cols);if(!name)return null;
        return{id:uid(),name,type:getType(cols)||'bank',accNo:getAccNo(cols)||'XXXX-0000',balance:parseFloat(getBal(cols).replace(/[,\s₹$€£¥]/g,''))||0,color:getColor(cols)||'#1a4a6e'};
      }).filter(Boolean);
      setData(d=>({...d,accounts:[...d.accounts,...accs]}));
      toast(`Imported ${accs.length} accounts`,'g');
    };
    r.readAsText(f);e.target.value='';
  };
  const downloadFundTemplate=()=>{
    const b=new Blob(['name,type,accNo,balance,color\nHDFC Bank Savings,bank,XXXX-1234,150000,#003366\nCash In Hand,cash,CASH-001,5000,#065f46\nPaytm Wallet,wallet,PAYTM-001,2500,#002970\nSBI FD,fd,FD-001,200000,#007A62\n'],{type:'text/csv'});
    const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='finmanager-accounts-template.csv';a.click();
  };

  const banks=accounts.filter(a=>a.type==='bank');
  const cashes=accounts.filter(a=>a.type==='cash');
  const wallets=accounts.filter(a=>a.type==='wallet');
  const fds=accounts.filter(a=>a.type==='fd');
  const bT=banks.reduce((s,a)=>s+a.balance,0);
  const cT=cashes.reduce((s,a)=>s+a.balance,0);
  const wT=wallets.reduce((s,a)=>s+a.balance,0);
  const fT=fds.reduce((s,a)=>s+a.balance,0);
  const liq=bT+cT+wT;

  const monthlyBudget=Object.values(budgetLimits).reduce((s,v)=>s+v,0);
  const today=new Date();
  const dom=today.getDate(),dim=new Date(today.getFullYear(),today.getMonth()+1,0).getDate();
  const curMK=`${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}`;
  const curExp=transactions.filter(t=>t.month===curMK&&t.type==='expense').reduce((s,t)=>s+t.amount,0);
  const unspent=monthlyBudget-curExp;
  const dLeft=dim-dom+1;

  const openAdd=t=>{setForm({...ef,type:t});setModal('add');};
  const openEdit=a=>{setForm({name:a.name,type:a.type,accNo:a.accNo,balance:String(a.balance),color:a.color||'#1a4a6e'});setModal({eid:a.id});};
  const close=()=>{setModal(null);setForm(ef);};

  const save=()=>{
    if(!form.name)return;
    const entry={name:form.name,type:form.type,accNo:form.accNo,balance:parseFloat(form.balance)||0,color:form.color};
    if(modal==='add'){setData(d=>({...d,accounts:[...d.accounts,{id:uid(),...entry}]}));toast('Account added','g');}
    else{setData(d=>({...d,accounts:d.accounts.map(a=>a.id===modal.eid?{...a,...entry}:a)}));toast('Account updated','g');}
    close();
  };
  const undoDel=makeUndoDelete(data,setData,toast);
  const del=id=>undoDel('Account removed',d=>({...d,accounts:d.accounts.filter(a=>a.id!==id)}));

  const AccRow=({a})=>{
    const ini=a.name.split(/[\s–\-]/).filter(Boolean).map(w=>w[0]).slice(0,2).join('').toUpperCase();
    return(
      <div className="acc-row">
        <div className="acc-ic" style={{background:(a.color||'#1a4a6e')+'22',color:a.color||'#1a4a6e'}}>{ini}</div>
        <div>
          <div className="acc-name">{a.name}</div>
          <div className="acc-no">{a.accNo}</div>
        </div>

          <div className={`acc-num ${a.balance<0?'neg':'pos'}`}>{fmtINR(a.balance)}</div>

          <button className="bic red" onClick={()=>del(a.id)}><Ic n="del" s={11}/></button>
        </div>

    );

  const GrpCard=({title,items,total,addType,icon,color})=>(
    <div className="card">
